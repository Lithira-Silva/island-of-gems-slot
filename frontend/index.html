<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Island of Gems</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Cinzel+Decorative:wght@700;900&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #070b1a; --sapphire: #0e1a3a; --sapphire-2: #15264f; --gold: #f2c14e; --gold-pale: #ffe7a3; --gold-deep: #8a5a0e;
    --moon: #c9d6f0; --mist: #8d9cc0; --text: #eef2fb; --emerald: #14b85f; --emerald-hi: #4fe39a; --ruby: #d4142f;
    --line: rgba(242, 193, 78, .32); --hair: rgba(201, 214, 240, .1);
    --f-display: "Cinzel Decorative", "Cinzel", Georgia, serif; --f-title: "Cinzel", Georgia, serif; --f-ui: "Manrope", "Segoe UI", system-ui, sans-serif;
    --oct: polygon(29.3% 0, 70.7% 0, 100% 29.3%, 100% 70.7%, 70.7% 100%, 29.3% 100%, 0 70.7%, 0 29.3%);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--night); color: var(--text); font-family: var(--f-ui);
    overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
  button:disabled { opacity: .35; cursor: default; }
  :focus-visible { outline: 2px solid var(--gold-pale); outline-offset: 3px; }
  svg { display: block; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---- shell: 16:9 stage with the deck over its foot (landscape) */
  #wrap { position: fixed; inset: 0; display: grid; place-items: center; }
  #shell { position: relative; width: min(100vw, calc(100vh * 16 / 9)); width: min(100vw, calc(100dvh * 16 / 9)); aspect-ratio: 16 / 9;
    container-type: inline-size; overflow: hidden;
    --b: clamp(40px, 3.4cqw, 60px); --spin: clamp(66px, 8.6cqw, 124px); --fs-l: clamp(9px, .78cqw, 12px); --fs-v: clamp(14px, 1.6cqw, 24px); --pad: clamp(8px, 1.6cqw, 28px); }
  #stagebox { position: absolute; inset: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: manipulation; }
  #session { position: absolute; top: clamp(6px, .8cqw, 12px); left: clamp(8px, 1cqw, 16px); padding: .3em .8em; border-radius: 999px;
    font-size: clamp(10px, .82cqw, 13px); font-weight: 700; color: var(--moon); font-variant-numeric: tabular-nums;
    background: rgba(7, 11, 26, .62); border: 1px solid var(--hair); pointer-events: none; white-space: nowrap; }
  #session i { font-style: normal; color: var(--mist); margin: 0 .45em; }

  /* ---- control deck */
  #deck { position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    gap: clamp(8px, 1.2cqw, 20px); padding: 0 var(--pad) clamp(6px, .9cqw, 14px);
    background: linear-gradient(180deg, rgba(7, 11, 26, 0), rgba(7, 11, 26, .88) 42%, rgba(7, 11, 26, .97)); }
  .side { display: flex; align-items: center; gap: clamp(6px, .8cqw, 14px); min-width: 0; }
  .side.l { justify-content: flex-end; }
  .tools { display: flex; gap: clamp(6px, .6cqw, 10px); margin-right: auto; }
  .plaque { display: flex; flex-direction: column; justify-content: center; height: var(--b); min-width: clamp(84px, 10.5cqw, 190px);
    padding: 0 clamp(8px, 1cqw, 16px); border-radius: calc(var(--b) * .28); border: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(21, 38, 79, .94), rgba(10, 18, 42, .94));
    box-shadow: inset 0 1px 0 rgba(255, 231, 163, .14), 0 4px 14px rgba(0, 0, 0, .35); }
  .lbl { display: block; font-size: var(--fs-l); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--mist); line-height: 1.15; }
  .plaque b, #betVal b { font-size: var(--fs-v); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.15; white-space: nowrap; }
  .plaque small { font-size: var(--fs-l); font-weight: 700; color: var(--mist); margin-left: .35em; }
  #winBox b { font-family: var(--f-title); font-weight: 900; color: var(--gold-pale); transition: text-shadow .2s, color .2s; }
  #winBox.flash { border-color: var(--gold); box-shadow: inset 0 1px 0 rgba(255, 231, 163, .3), 0 0 18px rgba(242, 193, 78, .35); }
  #winBox.flash b { color: #fff6d0; text-shadow: 0 0 12px rgba(242, 193, 78, .8); }
  .plaque.bet { flex-direction: row; align-items: center; gap: 4px; padding: 0 4px; }
  #betVal { flex: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: clamp(60px, 6cqw, 110px); border-radius: 8px; }
  #betVal:not(:disabled):hover b { color: var(--gold-pale); }
  .ib { width: var(--b); height: var(--b); flex: none; display: grid; place-items: center; border-radius: 50%; color: var(--gold-pale);
    background: linear-gradient(180deg, rgba(21, 38, 79, .94), rgba(10, 18, 42, .94)); border: 1px solid var(--line); transition: border-color .15s, background .15s; }
  .ib svg { width: 46%; height: 46%; }
  .ib:not(:disabled):hover { border-color: var(--gold); background: var(--sapphire-2); }
  .ib.sm { width: calc(var(--b) - 8px); height: calc(var(--b) - 8px); background: rgba(242, 193, 78, .08); }
  #btnMute .i-off, #btnMute[aria-pressed="true"] .i-on { display: none; }
  #btnMute[aria-pressed="true"] .i-off { display: block; }
  .mode { height: var(--b); display: flex; align-items: center; gap: .5em; padding: 0 clamp(10px, 1cqw, 16px); border-radius: 999px;
    font-size: var(--fs-l); font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--moon);
    background: linear-gradient(180deg, rgba(21, 38, 79, .94), rgba(10, 18, 42, .94)); border: 1px solid var(--line); transition: background .15s, color .15s; }
  .mode svg { width: calc(var(--b) * .4); height: calc(var(--b) * .4); flex: none; }
  .mode:hover { border-color: var(--gold); }
  .mode.buy { color: var(--gold-pale); border-color: var(--gold); background: linear-gradient(180deg, rgba(120, 20, 50, .95), rgba(60, 6, 24, .95)); }
  .mode.buy:not(:disabled):hover { filter: brightness(1.15); }
  .mode[aria-pressed="true"] { color: #2a1700; border-color: var(--gold); background: linear-gradient(180deg, var(--gold-pale), var(--gold) 60%, #c8902e); }

  /* ---- signature: the Spin gem (octagon cut, gold setting, emerald → ruby while spinning) */
  #spin { position: relative; width: var(--spin); height: var(--spin); margin-top: calc(var(--spin) * -.3); flex: none; border-radius: 30%;
    --gl: #c8ffe0; --gb: #14b85f; --gd: #03401f; --glow: rgba(20, 184, 95, .45);
    background: radial-gradient(circle at 14.6% 14.6%, #fff3c0 0 3%, #a8701f 4.6%, transparent 5.2%), radial-gradient(circle at 85.4% 14.6%, #fff3c0 0 3%, #a8701f 4.6%, transparent 5.2%),
                radial-gradient(circle at 14.6% 85.4%, #fff3c0 0 3%, #a8701f 4.6%, transparent 5.2%), radial-gradient(circle at 85.4% 85.4%, #fff3c0 0 3%, #a8701f 4.6%, transparent 5.2%);
    filter: drop-shadow(0 6px 12px rgba(0, 0, 0, .6)) drop-shadow(0 0 16px var(--glow)); transition: transform .12s ease, filter .25s; }
  #spin > span { position: absolute; clip-path: var(--oct); }
  #spin .bezel { inset: 3%; background: conic-gradient(from 10deg, #fff3c0, #c8902e, #6e3f0c, #f9e08b, #a8701f, #fff3c0, #c8902e, #6e3f0c, #f9e08b, #fff3c0); }
  #spin .stone { inset: 11%; overflow: hidden; transition: background .25s;
    background: conic-gradient(from 22.5deg, var(--gl) 0 12.5%, var(--gb) 0 25%, var(--gd) 0 37.5%, var(--gb) 0 50%, var(--gd) 0 62.5%, var(--gb) 0 75%, var(--gl) 0 87.5%, var(--gb) 0); }
  #spin .stone::after { content: ""; position: absolute; inset: -30%; background: linear-gradient(115deg, transparent 42%, rgba(255, 255, 255, .7) 50%, transparent 58%);
    transform: translateX(-130%); animation: glint 5s ease-in-out infinite; }
  #spin .table { inset: 31%; background: linear-gradient(160deg, rgba(255, 255, 255, .55), var(--gb) 55%, var(--gd)); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .3); }
  #spin svg, #spin em { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 2; color: #fff; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .7)); }
  #spin svg { width: 40%; height: 40%; transition: transform .5s cubic-bezier(.2, .8, .2, 1); }
  #spin em { font-style: normal; font-weight: 800; font-size: calc(var(--spin) * .26); font-variant-numeric: tabular-nums; }
  #spin .i-stop, #spin.stop .i-spin, #spin.auto .i-spin, #spin.auto .i-stop { display: none; }
  #spin.stop .i-stop { display: block; }
  #spin:not(.stop):not(.auto):hover .i-spin { transform: translate(-50%, -50%) rotate(-180deg); }
  #spin:hover { transform: translateY(-2px); }
  #spin:active { transform: scale(.95); }
  #spin.stop, #spin.auto { --gl: #ffc4cc; --gb: #d4142f; --gd: #3f000b; --glow: rgba(212, 20, 47, .5); }
  #spin.auto { --gl: #cfe6ff; --gb: #2258e6; --gd: #061758; --glow: rgba(34, 88, 230, .5); }
  @keyframes glint { 0%, 72% { transform: translateX(-130%); } 100% { transform: translateX(130%); } }

  /* ---- overlays and sheets */
  .overlay { position: absolute; inset: 0; z-index: 10; display: grid; place-items: center; padding: 12px; background: rgba(3, 5, 14, .72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .overlay[hidden] { display: none; }
  .sheet { width: min(780px, 100%); max-height: 100%; display: flex; flex-direction: column; overflow: hidden; border-radius: 18px; border: 1px solid var(--line);
    background: linear-gradient(180deg, #111d40, #0a1230 60%); box-shadow: 0 30px 80px rgba(0, 0, 0, .6), inset 0 1px 0 rgba(255, 231, 163, .15); animation: sheetIn .22s ease-out; }
  .sheet.narrow { width: min(520px, 100%); }
  .sheet header { display: flex; align-items: center; gap: 12px; padding: 12px 12px 10px 20px; border-bottom: 1px solid rgba(242, 193, 78, .18); }
  .sheet h2 { flex: 1; margin: 0; font-family: var(--f-title); font-size: 20px; letter-spacing: .06em; color: var(--gold); }
  .sheet .close { --b: 40px; }
  .sheet .body { overflow: auto; padding: 16px 20px 22px; font-size: 14px; line-height: 1.55; color: #d5def0; user-select: text; -webkit-user-select: text; }
  .sheet h3 { margin: 22px 0 10px; font-family: var(--f-title); font-size: 15px; letter-spacing: .05em; color: var(--gold-pale); }
  .sheet h3:first-child { margin-top: 0; }
  .sheet ul { padding-left: 1.2em; margin: 0; }
  .sheet li + li { margin-top: 6px; }
  @keyframes sheetIn { from { opacity: 0; transform: translateY(14px) scale(.98); } }
  .tabs { flex: 1; display: flex; gap: 6px; }
  .tab { min-height: 38px; padding: 0 16px; border-radius: 999px; font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--mist); }
  .tab:hover { color: var(--moon); }
  .tab[aria-selected="true"] { color: var(--gold-pale); background: rgba(242, 193, 78, .14); box-shadow: inset 0 0 0 1px var(--line); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { min-width: 60px; min-height: 42px; padding: 0 14px; border-radius: 10px; font-weight: 800; font-variant-numeric: tabular-nums;
    background: #13224a; border: 1px solid rgba(201, 214, 240, .16); transition: border-color .15s; }
  .chip:hover { border-color: var(--gold); }
  .chip[aria-pressed="true"] { color: #2a1700; border-color: var(--gold); background: linear-gradient(180deg, var(--gold-pale), var(--gold)); }
  .field + .field { margin-top: 18px; }
  .buycards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
  .bcard { display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: 14px; background: #13224a; border: 1px solid var(--line); }
  .bcard h3 { margin: 0; }
  .bcard p { margin: 0; flex: 1; font-size: 13px; color: var(--moon); }
  .bcard .price { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--gold-pale); }
  .bcard .price small { font-size: 12px; color: var(--mist); margin-left: 4px; }
  .bcard .cta { min-height: 46px; }
  .confirm { text-align: center; }
  .confirm .price { font-size: 30px; font-weight: 800; color: var(--gold-pale); margin: 6px 0 4px; font-variant-numeric: tabular-nums; }
  .confirm .row2 { display: flex; gap: 10px; margin-top: 20px; }
  .confirm .row2 > * { flex: 1; }
  .ghost { min-height: 50px; border-radius: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--moon); border: 1px solid rgba(201, 214, 240, .25); }
  .ghost:hover { border-color: var(--moon); }
  .flabel { margin-bottom: 8px; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--mist); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--hair); }
  .row .hint { display: block; font-size: 12px; color: var(--mist); }
  .switch { position: relative; width: 52px; height: 30px; flex: none; border-radius: 999px; background: #26355e; transition: background .18s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--moon); transition: transform .18s; }
  .switch[aria-checked="true"] { background: var(--emerald); }
  .switch[aria-checked="true"]::after { transform: translateX(22px); background: #fff; }
  input[type="range"] { width: min(200px, 45%); accent-color: var(--gold); }
  .cta { min-height: 50px; padding: 0 28px; border-radius: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #2a1700;
    background: linear-gradient(180deg, var(--gold-pale), var(--gold) 55%, #c8902e); box-shadow: 0 6px 18px rgba(242, 193, 78, .25), inset 0 1px 0 rgba(255, 255, 255, .6); }
  .cta:hover { filter: brightness(1.06); }
  .cta.wide { width: 100%; margin-top: 22px; }
  .note { margin-top: 16px; font-size: 12px; color: var(--mist); }

  /* paytable */
  .pt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 10px; }
  .sym { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 12px; background: #13224a; border: 1px solid rgba(201, 214, 240, .1); }
  .sym.wide { grid-column: span 2; }
  .sym img { width: 72px; height: auto; flex: none; }
  .sym .nm { font-size: 12px; font-weight: 800; color: var(--moon); margin-bottom: 2px; }
  .sym div div { font-size: 13px; line-height: 1.5; font-variant-numeric: tabular-nums; }
  .sym span { display: inline-block; width: 18px; font-weight: 800; color: var(--gold); }
  .pt-lines { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 8px; }
  .pt-lines figure { margin: 0; text-align: center; font-size: 11px; font-weight: 700; color: var(--mist); }
  .pt-lines svg { width: 100%; height: auto; margin-bottom: 2px; }

  /* history */
  .summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
  .summary div { padding: 10px 12px; border-radius: 12px; background: #13224a; }
  .summary b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
  .hist { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }
  .hist th { padding: 6px 8px; text-align: left; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--mist); }
  .hist td { padding: 8px; border-top: 1px solid var(--hair); }
  .hist .num { text-align: right; }
  .pos { color: var(--emerald-hi); font-weight: 800; }
  .neg { color: #ff9aa8; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 800; color: #2a1700; background: var(--gold); }
  .empty { padding: 28px 8px; text-align: center; color: var(--mist); }

  /* start screen */
  #start { z-index: 20; background: radial-gradient(ellipse at 50% 38%, rgba(21, 38, 79, .86), rgba(3, 5, 14, .97)); text-align: center; }
  #start h1 { margin: 0; font-family: var(--f-display); font-size: clamp(30px, 5.2cqw, 76px); line-height: 1.05;
    background: linear-gradient(180deg, #fff3c0, var(--gold) 45%, #a8701f 70%, var(--gold-pale)); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 10px rgba(0, 0, 0, .7)); }
  #start .tagline { margin: 8px 0 28px; font-family: var(--f-title); font-size: clamp(11px, 1.3cqw, 18px); letter-spacing: .2em; color: #f2d48a; }
  #start .cta { min-width: 200px; }
  #start p { margin-top: 22px; font-size: clamp(11px, .95cqw, 14px); color: var(--mist); }
  #loading { font-size: 14px; letter-spacing: .1em; color: var(--mist); }

  /* reduced motion: OS setting or the in-game switch */
  #shell.rm *, #shell.rm *::after { animation: none !important; transition: none !important; }
  @media (prefers-reduced-motion: reduce) { *, *::after { animation: none !important; transition: none !important; } }

  /* phone landscape: icon-only modes, mute lives in Settings */
  @media (orientation: landscape) and (max-height: 520px) {
    #btnMute { display: none; }
    .mode { width: var(--b); padding: 0; justify-content: center; }
    .mode span { display: none; }
    #session { display: none; }
  }

  /* portrait: reels on top (canvas cropped to the reel frame), deck below */
  @media (max-aspect-ratio: 4/5) {
    #shell { width: 100vw; height: 100vh; height: 100dvh; aspect-ratio: auto; display: flex; flex-direction: column;
      --b: clamp(44px, 12cqw, 58px); --spin: clamp(96px, 27cqw, 136px); --fs-l: clamp(10px, 2.8cqw, 13px); --fs-v: clamp(16px, 4.8cqw, 24px); }
    #stagebox { position: relative; inset: auto; width: 100%; flex: 1; min-height: 0; }
    #session { top: auto; bottom: 6px; left: 50%; transform: translateX(-50%); }
    #deck { position: relative; flex: none; background: linear-gradient(180deg, rgba(7, 11, 26, 0), var(--night) 30%); row-gap: 14px; column-gap: 10px;
      padding: 10px 16px calc(16px + env(safe-area-inset-bottom));
      grid-template-columns: 1fr 1fr auto 1fr 1fr;
      grid-template-areas: "bal bal buy win win" "autoplay down spin up turbo" "menu bet bet bet mute"; }
    .side, .tools, .plaque.bet { display: contents; }
    #spin { grid-area: spin; } #balBox { grid-area: bal; } #winBox { grid-area: win; } #btnAuto { grid-area: autoplay; } #btnTurbo { grid-area: turbo; }
    #betDown { grid-area: down; } #betUp { grid-area: up; } #betVal { grid-area: bet; } #btnMenu { grid-area: menu; } #btnMute { grid-area: mute; } #btnBuy { grid-area: buy; }
    #balBox, #winBox { min-width: 0; }
    #deck > *, .side > *, .tools > *, .plaque.bet > * { justify-self: center; }
    #balBox, #winBox, #betVal { justify-self: stretch; }
    #spin { margin-top: 0; }
    .ib.sm { width: var(--b); height: var(--b); }
    #betVal { height: var(--b); border: 1px solid var(--line); border-radius: calc(var(--b) * .28);
      background: linear-gradient(180deg, rgba(21, 38, 79, .94), rgba(10, 18, 42, .94)); }
    .mode { width: var(--b); padding: 0; justify-content: center; }
    .mode span { display: none; }
    .overlay { place-items: end center; padding: 0; }
    .sheet, .sheet.narrow { width: 100%; max-height: 92%; border-radius: 18px 18px 0 0; }
    .sheet .body { padding-bottom: calc(22px + env(safe-area-inset-bottom)); }
    .summary { grid-template-columns: repeat(2, 1fr); }
    .tab { padding: 0 12px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="shell">
    <div id="stagebox">
      <canvas id="stage" aria-label="Slot reels. Tap to skip animations."></canvas>
      <div id="session" aria-hidden="true"></div>
    </div>

    <div id="deck">
      <div class="side l">
        <div class="tools">
          <button class="ib" id="btnMenu" aria-label="Menu: paytable, history and settings" aria-haspopup="dialog">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
          </button>
          <button class="ib" id="btnMute" aria-label="Mute sound" aria-pressed="false">
            <svg class="i-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
            <svg class="i-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 6 6M22 9l-6 6"/></svg>
          </button>
        </div>
        <div class="plaque" id="balBox"><span class="lbl">Balance</span><span><b id="balance">0.00</b><small>FUN</small></span></div>

    if (total >= this.maxWin) { total = this.maxWin; events.push({ type: 'maxWinReached', amount: total }); }
    events.push({ type: 'finalWin', amount: r4(total) });
    return { payoutMultiplier: Math.round(total * 100), events };
  }
}

/* ======================================================= OUTCOME PROVIDERS
   Production: StakeRGSProvider. Outcomes come from pre-generated books on the RGS;
   the client NEVER decides results. LocalDemoProvider exists only for dev/demo.   */
class LocalDemoProvider {
  constructor(engine) { this.engine = engine; this.balance = 1000; this.forced = []; }
  async authenticate() { return { balance: this.balance, currency: 'FUN' }; }
  // QA only: queue the next round matching a predicate, e.g. r => r.events.some(e => e.type === 'freeSpinTrigger').
  // Optional mode: force(r => r.events.some(e => e.type === 'elephantStampede')), force(r => r.payoutMultiplier > 20000, 'bonus').
  force(pred, mode = 'base', tries = 500000) {
    for (let i = 0; i < tries; i++) { const r = this.engine.playRound(SecureRng, mode); if (pred(r)) { this.forced.push({ mode, round: r }); return r.payoutMultiplier / 100; } }
    return null;
  }
  // `bet` is the base bet; the mode's cost multiplies it (Bonus Buy = 100x).
  async play(bet, mode = 'base') {
    const cost = bet * this.engine.modes[mode].cost;
    if (cost > this.balance + 1e-9) throw new Error('INSUFFICIENT_FUNDS');
    this.balance -= cost;
    const i = this.forced.findIndex(f => f.mode === mode);
    const round = i >= 0 ? this.forced.splice(i, 1)[0].round : this.engine.playRound(SecureRng, mode);
    return { round, balance: this.balance };
  }
  async endRound(bet, round) { this.balance += round.payoutMultiplier / 100 * bet; return { balance: this.balance }; }
}

class StakeRGSProvider {
  // Skeleton of the Stake Engine RGS flow. Confirm endpoint names, amount scaling and
  // response shapes against the current Stake Engine docs before wiring this in.
  constructor() {
    const q = new URLSearchParams(location.search);
    this.rgs = q.get('rgs_url'); this.session = q.get('sessionID'); this.lang = q.get('lang') || 'en';
  }
  async post(path, body) {
    const r = await fetch(`https://${this.rgs}${path}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error(`RGS ${path} ${r.status}`);
    return r.json();
  }
  async authenticate() { return this.post('/wallet/authenticate', { sessionID: this.session, language: this.lang }); }
  // [verify] whether `amount` is the base bet or the mode cost for buy modes in the current Stake Engine spec.
  async play(bet, mode = 'base') { return this.post('/wallet/play', { sessionID: this.session, amount: Math.round(bet * 1e6), mode }); }
  async endRound() { return this.post('/wallet/end-round', { sessionID: this.session }); }
}

  win(level) {
    if (!this.ok()) return;

    const n = [3, 5, 9][clamp(level, 0, 2)];

  }
  tick() { if (!this.ok()) return; this.osc({ f: 2000 + Math.random() * 300, dur: .03, gain: .035 }); }
  coin() { if (!this.ok()) return; const f = 2300 + Math.random() * 1400; this.osc({ f, dur: .16, gain: .035 }); this.osc({ f: f * 1.5, dur: .1, gain: .02 }); }
  bigWin() {

  dhum(t, out, gain = .5) { this.osc({ f: 125, f2: 50, t, dur: .38, gain, out }); this.noise({ t, dur: .05, type: 'lowpass', f: 500, gain: gain * .25, out }); }

  }
  schedule() {
    if (!this.ok()) return;

    const reed = [587.33, 622.25, 739.99, 783.99, 880, 932.33, 1108.73, 1174.66]; // D double-harmonic
    const phrase = [0, -1, 2, -1, 3, 4, -1, 3, 2, -1, 1, 0, -1, -1, 2, -1, 4, -1, 5, 4, 3, -1, 2, 3, 2, -1, 1, -1, 0, -1, -1, -1];

      const s = this.step, p = s % 16, t = this.next;

        if ([0, 6, 10].includes(p)) this.dhum(t, out, .38);
        if (p === 4 || p === 12) this.tha(t, out, .16);

        if (p % 8 === 0 && Math.random() < .45) {
          const f = [293.66, 329.63, 369.99, 440, 493.88, 587.33][Math.floor(Math.random() * 6)];
          this.osc({ f, t, dur: 1.4, gain: .05, attack: .08, out, verb: .5 });
          this.osc({ f: f * 2, t, dur: .9, gain: .012, attack: .08, out });
        }
      }
      this.next += sp; this.step = (this.step + 1) % 32;
    }
  }
}

const GOLD = ['#6e3f0c', '#f9e08b', '#c8902e', '#fff3c0', '#a8701f'];

// Polished gold: a conic gradient gives the angular light bands of real metal.

  c.fillStyle = fur; c.beginPath(); c.ellipse(cx, cy, 48, 46, 0, 0, TAU); c.fill();
  c.lineWidth = 3; c.strokeStyle = goldGrad(c, cx - 48, cy - 46, cx + 48, cy + 46); c.stroke();
  const rnd = seeded(31); // rosettes
  c.fillStyle = 'rgba(50,22,4,.85)';
  for (let i = 0; i < 30; i++) {
    const a = rnd() * TAU, r = 20 + rnd() * 24, x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r * .95, sz = 2 + rnd() * 2.4;
    if (y > cy - 16 && Math.abs(x - cx) < 30) continue; // keep eyes and muzzle clean
    c.beginPath(); c.arc(x, y, sz, 0, TAU); c.fill();
  }
  c.fillStyle = '#fff3dc';
  [-1, 1].forEach(s => { c.beginPath(); c.ellipse(cx + s * 11, cy + 22, 14, 11, 0, 0, TAU); c.fill(); });
  c.beginPath(); c.ellipse(cx, cy + 34, 10, 6, 0, 0, TAU); c.fill();
  [-1, 1].forEach(s => { // eyes and tear marks
    const ex = cx + s * 18, ey = cy - 6;
    c.fillStyle = '#2a1404'; c.beginPath(); c.ellipse(ex, ey, 11, 7.5, -s * .25, 0, TAU); c.fill();
    const iris = c.createRadialGradient(ex, ey, 1, ex, ey, 8); iris.addColorStop(0, '#fff7a0'); iris.addColorStop(1, '#5fbf3a');
    c.fillStyle = iris; c.beginPath(); c.ellipse(ex, ey, 8.5, 6, -s * .25, 0, TAU); c.fill();
    c.fillStyle = '#000'; c.beginPath(); c.ellipse(ex, ey, 2, 5.5, 0, 0, TAU); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(ex - 2, ey - 2, 1.4, 0, TAU); c.fill();
    c.strokeStyle = '#2a1404'; c.lineWidth = 2; c.beginPath(); c.moveTo(ex - s * 3, ey + 7); c.quadraticCurveTo(ex - s * 6, ey + 14, ex - s * 9, ey + 18); c.stroke();
  });
  c.fillStyle = '#c0506a'; poly(c, [[cx - 8, cy + 12], [cx + 8, cy + 12], [cx, cy + 21]]); c.fill();
  c.strokeStyle = '#3a1a06'; c.lineWidth = 1.6; c.beginPath(); c.moveTo(cx, cy + 21); c.lineTo(cx, cy + 27);
  c.quadraticCurveTo(cx - 6, cy + 32, cx - 11, cy + 28); c.moveTo(cx, cy + 27); c.quadraticCurveTo(cx + 6, cy + 32, cx + 11, cy + 28); c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 1;
  [-1, 1].forEach(s => { for (let k = 0; k < 3; k++) { c.beginPath(); c.moveTo(cx + s * 18, cy + 24 + k * 3); c.lineTo(cx + s * 46, cy + 16 + k * 8); c.stroke(); } });
  sparkle(c, cx + 34, cy - 40, 6, .8);
}

/* ---- Faceted oval brilliant: table, star, kite and upper-girdle facets. Brightness mixes a key light with a
   per-facet scramble (internal reflections), which is what makes a real gem scintillate. */
function drawBrilliant(c, cx, cy, rx, ry, col, seed) {
  const A = i => -Math.PI / 2 + i * Math.PI / 8, P = (r, a) => [cx + Math.cos(a) * rx * r, cy + Math.sin(a) * ry * r];
  bezelSetting(c, cx, cy, rx, ry, 0);
  const table = Array.from({ length: 8 }, (_, i) => P(.5, A(i * 2)));
  const star = Array.from({ length: 8 }, (_, i) => P(.76, A(i * 2 + 1)));
  const gird = Array.from({ length: 16 }, (_, i) => P(1, A(i)));
  const facets = [];
  for (let i = 0; i < 8; i++) {
    const j = (i + 1) % 8, h = (i + 7) % 8;
    facets.push({ pts: [table[i], table[j], star[i]], tilt: .3 });
    facets.push({ pts: [table[i], star[h], gird[i * 2], star[i]], tilt: .6 });
    facets.push({ pts: [star[i], gird[i * 2], gird[i * 2 + 1]], tilt: .9 });
    facets.push({ pts: [star[i], gird[i * 2 + 1], gird[(i * 2 + 2) % 16]], tilt: .9 });
  }
  facets.forEach((f, k) => {
    const gx = f.pts.reduce((a, p) => a + p[0], 0) / f.pts.length, gy = f.pts.reduce((a, p) => a + p[1], 0) / f.pts.length;
    const ang = Math.atan2((gy - cy) / ry, (gx - cx) / rx);
    const lambert = clamp(.5 - (Math.cos(ang) * .55 + Math.sin(ang) * .7) * f.tilt * .8, 0, 1);
    const s = clamp(lambert * .6 + hash(k + seed) * .62 - .12, 0, 1);
    const g = c.createLinearGradient(f.pts[0][0], f.pts[0][1], gx * 2 - f.pts[0][0], gy * 2 - f.pts[0][1]);
    g.addColorStop(0, mix(col.deep, col.light, Math.pow(s, 1.3)));
    g.addColorStop(1, mix(col.deep, col.base, s * .85 + .1));
    poly(c, f.pts); c.fillStyle = g; c.fill();
    c.strokeStyle = `rgba(255,255,255,${.1 + s * .3})`; c.lineWidth = .6; c.stroke();
  });
  // table: pavilion "arrows" seen through it, then a soft window reflection
  c.save(); poly(c, table); c.clip();
  const tg = c.createLinearGradient(cx - rx * .5, cy - ry * .5, cx + rx * .5, cy + ry * .5);
  tg.addColorStop(0, mix(col.base, col.light, .6)); tg.addColorStop(.55, col.base); tg.addColorStop(1, col.deep);
  c.fillStyle = tg; c.fillRect(cx - rx, cy - ry, rx * 2, ry * 2);
  for (let i = 0; i < 16; i++) {
    poly(c, [[cx, cy], P(.6, A(i)), P(.6, A(i + 1))]);
    c.fillStyle = i % 2 ? `rgba(0,0,20,${.18 + hash(i + seed * 3) * .2})` : `rgba(255,255,255,${.05 + hash(i + seed) * .12})`; c.fill();
  }
  const win = c.createLinearGradient(cx - rx * .4, cy - ry * .45, cx + rx * .1, cy - ry * .05);
  win.addColorStop(0, 'rgba(255,255,255,0)'); win.addColorStop(.45, 'rgba(255,255,255,.5)'); win.addColorStop(.6, 'rgba(255,255,255,.08)'); win.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = win; c.fillRect(cx - rx, cy - ry, rx * 2, ry * 2);
  c.restore();
  poly(c, table); c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = .8; c.stroke();
  // dispersion "fire": small spectral flecks
  c.save(); c.globalCompositeOperation = 'lighter';
  ['rgba(255,70,90,.26)', 'rgba(80,255,170,.22)', 'rgba(255,220,80,.26)', 'rgba(150,120,255,.26)', 'rgba(255,140,40,.22)'].forEach((fc, i) => {
    const f = facets[Math.floor(hash(i * 7 + seed) * facets.length)]; c.fillStyle = fc; poly(c, f.pts); c.fill();
  });
  c.restore();
  // edge absorption darkens the girdle like a real stone
  c.save(); c.beginPath(); c.ellipse(cx, cy, rx, ry, 0, 0, TAU); c.clip();
  const edge = c.createRadialGradient(cx, cy, Math.min(rx, ry) * .65, cx, cy, Math.max(rx, ry)); edge.addColorStop(0, 'rgba(0,0,0,0)'); edge.addColorStop(1, 'rgba(0,0,10,.4)');
  c.fillStyle = edge; c.fillRect(cx - rx, cy - ry, rx * 2, ry * 2); c.restore();
  for (const a of [Math.PI * .25, Math.PI * .75, Math.PI * 1.25, Math.PI * 1.75]) { // claw prongs
    const [x, y] = P(1.02, a);
    c.save(); c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 3; c.shadowOffsetY = 1.5; goldBead(c, x, y, 4.6); c.restore();
  }
  glint(c, cx - rx * .3, cy - ry * .42, 9, 1); glint(c, cx + rx * .42, cy + ry * .18, 5, .8); glint(c, cx - rx * .55, cy + ry * .5, 3.5, .6);
}

/* ---- Cabochon: smooth dome. Light enters top-left and glows out lower-right; the rim darkens; a crisp window
   reflection and a refracted rim light sell the curvature. `inner` paints the optical effect inside the dome. */
function drawCabochon(c, cx, cy, rx, ry, col, inner, beads = 30) {
  bezelSetting(c, cx, cy, rx, ry, beads);
  c.save(); c.beginPath(); c.ellipse(cx, cy, rx, ry, 0, 0, TAU); c.clip();
  const body = c.createRadialGradient(cx + rx * .22, cy + ry * .32, 2, cx, cy, Math.max(rx, ry) * 1.05);
  body.addColorStop(0, col.glow); body.addColorStop(.48, col.base); body.addColorStop(1, col.deep);
  c.fillStyle = body; c.fillRect(cx - rx, cy - ry, rx * 2, ry * 2);
  inner(c);
  const rim = c.createRadialGradient(cx - rx * .1, cy - ry * .1, Math.min(rx, ry) * .6, cx, cy, Math.max(rx, ry) * 1.02);
  rim.addColorStop(0, 'rgba(0,0,0,0)'); rim.addColorStop(1, `rgba(0,0,0,${col.rim ?? .5})`);
  c.fillStyle = rim; c.fillRect(cx - rx, cy - ry, rx * 2, ry * 2);
  const cres = new Path2D(); // curved gloss crescent that hugs the dome
  cres.ellipse(cx - rx * .06, cy - ry * .08, rx * .8, ry * .78, 0, Math.PI * 1.08, Math.PI * 1.62);
  cres.ellipse(cx + rx * .06, cy + ry * .1, rx * .78, ry * .76, 0, Math.PI * 1.55, Math.PI * 1.12, true); cres.closePath();
  const cg = c.createLinearGradient(cx - rx * .7, cy - ry * .7, cx - rx * .1, cy - ry * .1); cg.addColorStop(0, 'rgba(255,255,255,.75)'); cg.addColorStop(1, 'rgba(255,255,255,.05)');
  c.fillStyle = cg; c.fill(cres);
  const soft = c.createRadialGradient(cx - rx * .3, cy - ry * .38, 1, cx - rx * .3, cy - ry * .38, rx * .55);
  soft.addColorStop(0, 'rgba(255,255,255,.28)'); soft.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = soft; c.fillRect(cx - rx, cy - ry, rx * 2, ry * 2);
  c.strokeStyle = 'rgba(255,255,255,.4)'; c.lineWidth = 2.2; c.filter = 'blur(1px)';
  c.beginPath(); c.ellipse(cx, cy, rx * .9, ry * .9, 0, Math.PI * .05, Math.PI * .6); c.stroke(); c.filter = 'none';
  c.restore();
  c.strokeStyle = 'rgba(0,0,0,.45)'; c.lineWidth = 1; c.beginPath(); c.ellipse(cx, cy, rx, ry, 0, 0, TAU); c.stroke();
}

const drawSapphire = c => {
  glowDisc(c, 80, 68, 76, 'rgba(70,140,255,A)', .5);
  drawBrilliant(c, 80, 68, 44, 54, { light: '#d4ecff', base: '#2155d6', deep: '#020a2e' }, 3);
};

function drawRuby(c) { // star ruby: deep red cabochon with silk and a six-rayed star
  const cx = 80, cy = 68, rx = 50, ry = 46;
  glowDisc(c, cx, cy, 78, 'rgba(255,40,80,A)', .5);
  drawCabochon(c, cx, cy, rx, ry, { glow: '#ff5a70', base: '#b00c28', deep: '#2e020b' }, c => {
    c.strokeStyle = 'rgba(255,190,205,.028)'; c.lineWidth = .5; // rutile silk
    for (const a of [0, Math.PI / 3, -Math.PI / 3]) for (let k = -26; k <= 26; k++) {
      const ox = Math.cos(a + Math.PI / 2) * k * 2.2, oy = Math.sin(a + Math.PI / 2) * k * 2.2;
      c.beginPath(); c.moveTo(cx + ox - Math.cos(a) * 70, cy + oy - Math.sin(a) * 70); c.lineTo(cx + ox + Math.cos(a) * 70, cy + oy + Math.sin(a) * 70); c.stroke();
    }
    const sx = cx - 5, sy = cy - 8; // the star sits under the light
    c.save(); c.globalCompositeOperation = 'lighter'; c.lineCap = 'round';
    for (const a of [Math.PI / 2, Math.PI / 6, -Math.PI / 6]) for (const [w, al] of [[6, .16], [2.2, .55], [.9, .9]]) {
      const dx = Math.cos(a) * rx * 1.05, dy = Math.sin(a) * ry * 1.05, bend = 5;
      const g = c.createLinearGradient(sx - dx, sy - dy, sx + dx, sy + dy);
      g.addColorStop(0, 'rgba(255,220,230,0)'); g.addColorStop(.5, `rgba(255,236,242,${al})`); g.addColorStop(1, 'rgba(255,220,230,0)');
      c.strokeStyle = g; c.lineWidth = w; c.beginPath(); c.moveTo(sx - dx, sy - dy);
      c.quadraticCurveTo(sx - Math.sin(a) * bend, sy + Math.cos(a) * bend, sx + dx, sy + dy); c.stroke();
    }
    const bloom = c.createRadialGradient(sx, sy, 0, sx, sy, 16); bloom.addColorStop(0, 'rgba(255,240,245,.85)'); bloom.addColorStop(1, 'rgba(255,200,215,0)');
    c.fillStyle = bloom; c.beginPath(); c.arc(sx, sy, 16, 0, TAU); c.fill(); c.restore();
  });
  glint(c, cx - 5, cy - 8, 7, .9);
}

function drawCatsEye(c) { // chrysoberyl cat's eye: honey-green dome with one sharp band of light
  const cx = 80, cy = 68, rx = 42, ry = 52;
  glowDisc(c, cx, cy, 76, 'rgba(210,230,90,A)', .45);
  drawCabochon(c, cx, cy, rx, ry, { glow: '#f6ee9a', base: '#9c8f22', deep: '#2c2605' }, c => {
    const milk = c.createLinearGradient(cx - rx, 0, cx + rx, 0); // milk-and-honey: the lit side turns milky
    milk.addColorStop(0, 'rgba(255,250,215,.32)'); milk.addColorStop(.5, 'rgba(255,250,215,0)'); milk.addColorStop(1, 'rgba(60,40,0,.2)');
    c.fillStyle = milk; c.fillRect(cx - rx, cy - ry, rx * 2, ry * 2);
    c.strokeStyle = 'rgba(255,255,220,.05)'; c.lineWidth = .6;
    for (let y = cy - ry; y < cy + ry; y += 1.6) { c.beginPath(); c.moveTo(cx - rx, y); c.lineTo(cx + rx, y); c.stroke(); } // fibrous silk
    c.save(); c.globalCompositeOperation = 'lighter';
    for (const [w, al] of [[22, .14], [8, .32], [2.6, .95]]) {
      const g = c.createLinearGradient(0, cy - ry, 0, cy + ry);
      g.addColorStop(0, 'rgba(255,255,230,0)'); g.addColorStop(.35, `rgba(255,255,236,${al})`); g.addColorStop(.6, `rgba(255,255,236,${al})`); g.addColorStop(1, 'rgba(255,255,230,0)');
      c.fillStyle = g; c.beginPath(); c.ellipse(cx + 3, cy, w / 2, ry, 0, 0, TAU); c.fill();
    }
    c.restore();
  });
  glint(c, cx + 3, cy - 14, 6, .9);
}

function drawMoonstone(c) { // milky adularia dome with a floating blue sheen
  const cx = 80, cy = 68, rx = 50, ry = 44;
  glowDisc(c, cx, cy, 78, 'rgba(150,200,255,A)', .5);
  drawCabochon(c, cx, cy, rx, ry, { glow: '#eef1f8', base: '#b9c0d2', deep: '#4f5873', rim: .35 }, c => {
    const veil = c.createLinearGradient(cx - rx, cy - ry, cx + rx, cy + ry); veil.addColorStop(0, 'rgba(255,255,255,.25)'); veil.addColorStop(1, 'rgba(120,130,160,.2)');
    c.fillStyle = veil; c.fillRect(cx - rx, cy - ry, rx * 2, ry * 2);
    c.save(); c.filter = 'blur(4px)';
    for (const [x, y, w, h, r, col] of [[cx + 8, cy - 4, 32, 17, -.4, 'rgba(40,110,255,.5)'], [cx + 4, cy + 2, 22, 10, -.2, 'rgba(70,160,255,.55)'],
      [cx + 14, cy - 10, 14, 6, -.6, 'rgba(190,230,255,.7)'], [cx - 16, cy + 14, 14, 7, .3, 'rgba(120,100,255,.3)']]) {
      c.fillStyle = col; c.beginPath(); c.ellipse(x, y, w, h, r, 0, TAU); c.fill();
    }
    c.filter = 'none'; c.restore();
    c.strokeStyle = 'rgba(255,255,255,.12)'; c.lineWidth = .7; // faint internal cleavage
    for (const [x, y, l, a] of [[cx - 20, cy - 4, 14, .5], [cx + 10, cy + 16, 10, -.3], [cx - 4, cy + 22, 8, .9]]) { c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke(); }
  });
  glint(c, cx + 18, cy - 20, 6, .8);
}

function drawNumber(c, txt, cols) {
  glowDisc(c, 80, 72, 66, cols.glow, .4);
  const size = txt.length > 1 ? 86 : 100;
  const [tc, t] = mkCanvas(160 * TEX, 140 * TEX); t.scale(TEX, TEX);
  t.font = `900 ${size}px ${FONT_N}`; t.textAlign = 'center'; t.textBaseline = 'middle';
  const y = 76;
  const fill = t.createLinearGradient(0, y - size / 2, 0, y + size / 2);
  fill.addColorStop(0, cols.a); fill.addColorStop(.5, cols.b); fill.addColorStop(1, cols.c);
  t.fillStyle = fill; t.fillText(txt, 80, y);
  t.globalCompositeOperation = 'source-atop';
  const gl = t.createLinearGradient(0, y - size / 2, 0, y); gl.addColorStop(0, 'rgba(255,255,255,.65)'); gl.addColorStop(1, 'rgba(255,255,255,0)');
  t.fillStyle = gl; t.fillRect(0, 0, 160, y - 4);
  c.font = `900 ${size}px ${FONT_N}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
  c.lineWidth = 13; c.strokeStyle = 'rgba(0,0,0,.5)'; c.strokeText(txt, 82, y + 4);
  c.lineWidth = 10; c.strokeStyle = cols.d; c.strokeText(txt, 80, y);
  c.lineWidth = 4; c.strokeStyle = goldGrad(c, 20, y - 50, 140, y + 50); c.strokeText(txt, 80, y);
  c.drawImage(tc, 0, 0, 160, 140);
  sparkle(c, 112, 40, 6, .8);
}

const SYMBOL_PAINTERS = {
  W: drawElephant, S: drawLionRock, H1: drawLeopard, H2: drawSapphire, H3: drawRuby, H4: drawCatsEye, H5: drawMoonstone,
  L1: c => drawNumber(c, '10', { a: '#fff1b0', b: '#f0a02a', c: '#8a4a08', d: '#3a1a02', glow: 'rgba(255,170,40,A)' }),
  L2: c => drawNumber(c, '9',  { a: '#c8ffe0', b: '#22b36b', c: '#0a4a2a', d: '#021a0e', glow: 'rgba(40,220,130,A)' }),
  L3: c => drawNumber(c, '8',  { a: '#efd8ff', b: '#a052ea', c: '#3a0f6a', d: '#160428', glow: 'rgba(170,90,255,A)' }),
  L4: c => drawNumber(c, '7',  { a: '#d0f6ff', b: '#25a8d8', c: '#08405a', d: '#021822', glow: 'rgba(40,180,240,A)' }),
};

function buildTextures() {
  const tex = {}, blur = {};
  for (const [sym, paint] of Object.entries(SYMBOL_PAINTERS)) {
    const [cv, c] = mkCanvas(SW * TEX, SH * TEX); c.scale(TEX, TEX); paint(c); tex[sym] = cv;
    const [bv, b] = mkCanvas(SW * TEX, SH * TEX); const n = 9, spread = SH * TEX * .32;
    b.globalAlpha = .2; for (let i = 0; i < n; i++) b.drawImage(cv, 0, (i / (n - 1) - .5) * spread);
    blur[sym] = bv;
  }
  return { tex, blur };
}

/* ============================================================ REEL */
class Reel {
  constructor(i) { this.i = i; this.top = 0; this.offset = 0; this.state = 'idle'; this.speed = 0; this.vel = 0; this.over = new Map(); this.pop = [0, 0, 0]; this.antic = 0; }
  setStrip(strip, stop) { this.strip = strip; this.offset = stop; this.top = 0; this.over.clear(); }
  symAt(j) { if (this.over.has(j)) return this.over.get(j); const L = this.strip.length; return this.strip[(((j + this.offset) % L) + L) % L]; }
  makeWild(t) { for (let r = 0; r < NROW; r++) { this.over.set(r, 'W'); this.pop[r] = t; } } // Elephant Stampede: full wild reel
  start(t, delay, vmax) { this.over.clear(); this.state = 'wait'; this.t0 = t + delay; this.vmax = vmax; this.top0 = this.top; this.pop = [0, 0, 0]; }
  requestStop(stop, t, extra) {
    const F = Math.floor(this.top) - extra;
    const L = this.strip.length;
    for (let k = -1; k <= 3; k++) this.over.set(F + k, this.strip[(((stop + k) % L) + L) % L]);
    this.stopFrom = this.top; this.dist = this.top - F; this.F = F; this.finalStop = stop;
    this.dur = this.dist * LAND_D0 / this.vmax; this.ts = t; this.state = 'stopping';
    return new Promise(res => { this.onLand = res; });
  }
  update(t, dt) {
    const prev = this.top;
    switch (this.state) {
      case 'wait': if (t >= this.t0) { this.state = 'windup'; this.ts = t; } break;
      case 'windup': { const u = Math.min(1, (t - this.ts) / .12); this.top = this.top0 + .2 * Ease.outQuad(u); if (u >= 1) { this.state = 'accel'; this.ts = t; } break; }
      case 'accel': { const u = Math.min(1, (t - this.ts) / .2); this.speed = this.vmax * Ease.inQuad(u); this.top -= this.speed * dt; if (u >= 1) this.state = 'spin'; break; }
      case 'spin': this.top -= this.vmax * dt; break;
      case 'stopping': {
        const u = Math.min(1, (t - this.ts) / this.dur);
        this.top = this.stopFrom - this.dist * landCurve(u);
        if (u >= 1) {
          this.offset = this.finalStop - 0; this.top = 0; this.over.clear(); this.state = 'idle'; this.vel = 0;
          const cb = this.onLand; this.onLand = null; cb && cb();
          return;
        }
        break;
      }
    }
    this.vel = dt > 0 ? Math.abs(prev - this.top) / dt : 0;
  }
}

/* ============================================================ VIEW */
class View {
  constructor(canvas, art) {
    this.cv = canvas; this.ctx = canvas.getContext('2d'); this.art = art;
    this.reels = Array.from({ length: NR }, (_, i) => new Reel(i));
    this.particles = []; this.tweens = []; this.toasts = []; this.overlay = null; this.charges = []; this.quake = null;
    this.win = null; this.mode = 'base'; this.fsHud = null;
    this.t = 0; this.last = performance.now();
    this.buildStatic();
    this.reduced = false;
    this.resize(); new ResizeObserver(() => this.resize()).observe(this.cv);
  }
  // Camera: landscape shows the full 1280x720 stage. Portrait fits the reel frame (x 200..1080) to the width
  // and sits the stage on the deck; any extra height shows open sky above it.
  resize() {
    const r = this.cv.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
    if (!r.width || !r.height) return;
