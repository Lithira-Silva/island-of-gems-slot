        if (y > RY + SH * NROW || y + SH < RY) continue;
        if (reel.state === 'idle' && r >= 0 && r < 3 && hot.has(reel.i * 10 + r)) continue;
        const pop = reel.state === 'idle' && r >= 0 && r < 3 ? reel.pop[r] : 0;
        const ps = pop ? 1 + .22 * Math.sin(Math.min(1, (t - pop) / .4) * Math.PI) * (t - pop < .4 ? 1 : 0) : 1;
        const img = blurred ? this.art.blur[sym] : this.art.tex[sym];
        c.drawImage(img, x + SW / 2 - SW * ps / 2, y + SH / 2 - SH * ps / 2, SW * ps, SH * ps);
        if (win && reel.state === 'idle' && r >= 0 && r < 3) { c.fillStyle = 'rgba(0,0,0,.55)'; c.fillRect(x, y, SW, SH); }
      }
      const sh = c.createLinearGradient(0, RY, 0, RY + SH * NROW);
      sh.addColorStop(0, 'rgba(0,0,0,.55)'); sh.addColorStop(.12, 'rgba(0,0,0,0)'); sh.addColorStop(.88, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(0,0,0,.55)');
      c.fillStyle = sh; c.fillRect(x, RY, SW, SH * NROW);
      for (const ch of this.charges) { // Elephant Stampede: an elephant charges down the reel on a gold column
        if (ch.r !== reel.i) continue;
        const u = (t - ch.t0) / .5, a = clamp(1 - Math.abs(u - .5) * 1.4, 0, 1);
        const gc = c.createLinearGradient(x, 0, x + SW, 0); gc.addColorStop(0, 'rgba(255,200,90,0)'); gc.addColorStop(.5, `rgba(255,214,120,${.55 * a})`); gc.addColorStop(1, 'rgba(255,200,90,0)');
        c.fillStyle = gc; c.fillRect(x, RY, SW, SH * NROW);
        if (u < 1) { const y = RY - SH * 1.2 + Ease.inQuad(u) * (SH * NROW + SH * 1.4); c.drawImage(this.art.tex.W, x - 8, y, SW + 16, SH + 14); }
      }
      c.restore();
      if (reel.antic) {
        const a = .55 + .35 * Math.sin(t * 14);
        c.save(); c.globalCompositeOperation = 'lighter'; c.strokeStyle = `rgba(255,190,60,${a})`; c.lineWidth = 6; c.shadowColor = '#ffb020'; c.shadowBlur = 26;
        c.strokeRect(x + 3, RY + 3, SW - 6, SH * NROW - 6); c.restore();
        if (!this.reduced && Math.random() < .5) this.emit({ type: 'spark', x: x + rand(0, SW), y: RY + SH * NROW, vx: rand(-20, 20), vy: rand(-320, -160), g: 0, life: .9, max: .9, size: rand(8, 16), glow: 'gold' });
      }
    }
    if (!win) return;
    const el = t - win.t0;
    for (const w of active) {
      if (w.line == null) continue;
      const line = CFG.paylines[w.line];
      const pts = [[RX - 14, RY + line[0] * SH + SH / 2], ...line.map((row, r) => this.cellCenter(r, row)), [RX + SW * NR + 14, RY + line[4] * SH + SH / 2]];
      let len = 0; for (let i = 1; i < pts.length; i++) len += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
      const prog = active.length > 1 || win.list.length === 1 ? clamp(el / .5, 0, 1) : 1;
      c.save(); c.lineJoin = 'round'; c.lineCap = 'round';
      c.setLineDash([len, len]); c.lineDashOffset = len * (1 - Ease.outCubic(prog));
      c.beginPath(); pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y));
      c.shadowColor = w.color; c.shadowBlur = 18; c.strokeStyle = w.color; c.lineWidth = 7; c.globalAlpha = .9; c.stroke();
      c.shadowBlur = 0; c.strokeStyle = '#fff'; c.lineWidth = 2; c.stroke();
      c.restore();
    }
    for (const w of active) for (const [r, row] of w.cells) {
      const [cx, cy] = this.cellCenter(r, row), sym = this.reels[r].symAt(row);
      const s = 1.04 + .08 * Math.abs(Math.sin((t - win.t0) * 3.4));
      c.save(); c.globalCompositeOperation = 'lighter'; c.globalAlpha = .5 + .25 * Math.sin(t * 6);
      c.drawImage(this.glows.gold, cx - 90, cy - 90, 180, 180); c.restore();
      c.drawImage(this.art.tex[sym], cx - SW * s / 2, cy - SH * s / 2, SW * s, SH * s);
    }
    if (active.length === 1 && win.list.length > 1) {
      const w = active[0], [lr, lrow] = w.cells[w.cells.length - 1], [cx, cy] = this.cellCenter(lr, lrow);
      const label = w.label;
      c.save(); c.font = `800 20px ${FONT_N}`; const tw = c.measureText(label).width + 28;
      c.fillStyle = 'rgba(10,6,20,.88)'; c.beginPath(); c.roundRect(cx - tw / 2, cy + SH / 2 - 40, tw, 32, 16); c.fill();
      c.strokeStyle = w.color; c.lineWidth = 2; c.stroke();
      c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(label, cx, cy + SH / 2 - 24); c.restore();
    }
  }
  drawParticles(c, types) {
    c.save();
    for (const p of this.particles) {
      if (!types.includes(p.type)) continue;
      const a = clamp(p.life / p.max, 0, 1);
      if (p.type === 'coin') {
        const sx = Math.cos(this.t * p.spin + p.ph);
        c.globalAlpha = Math.min(1, a * 2);
        c.save(); c.translate(p.x, p.y); c.scale(Math.abs(sx) < .08 ? .08 : sx, 1); c.drawImage(this.coin, -p.size / 2, -p.size / 2, p.size, p.size); c.restore();
      } else {
        c.globalCompositeOperation = 'lighter';
        c.globalAlpha = p.type === 'firefly' ? a * (.5 + .5 * Math.sin(this.t * 4 + p.ph)) : a;
        const s = p.size * (p.type === 'ember' ? a : 1);
        c.drawImage(this.glows[p.glow], p.x - s, p.y - s, s * 2, s * 2);
        c.globalCompositeOperation = 'source-over';
      }
    }
    c.restore();
  }
  drawToasts(c, t) {
    this.toasts = this.toasts.filter(o => t - o.t0 < o.dur);
    for (const o of this.toasts) {
      const u = (t - o.t0) / o.dur, s = Ease.outBack(Math.min(1, u * 4)), a = u > .7 ? 1 - (u - .7) / .3 : 1;
      c.save(); c.globalAlpha = a; c.translate(W / 2, o.y - u * 40); c.scale(s, s);
      c.font = `900 ${o.size}px ${FONT_N}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
      c.lineWidth = 10; c.strokeStyle = '#1a0a00'; c.strokeText(o.text, 0, 0); c.fillStyle = o.color; c.fillText(o.text, 0, 0);
      c.restore();
    }
  }
  rays(c, x, y, t, alpha, col = '255,210,110') {
    c.save(); c.translate(x, y); c.rotate(this.reduced ? 0 : t * .25); c.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 18; i++) {
      c.rotate(TAU / 18);
      const g = c.createLinearGradient(0, 0, 0, -700); g.addColorStop(0, `rgba(${col},${.35 * alpha})`); g.addColorStop(1, `rgba(${col},0)`);
      c.fillStyle = g; c.beginPath(); c.moveTo(0, 0); c.lineTo(-60, -700); c.lineTo(60, -700); c.closePath(); c.fill();
    }
    c.restore();
  }
  bigText(c, text, x, y, size, fill, s = 1, font = FONT_N) {
    c.save(); c.font = `900 ${size}px ${font}`;
    const fit = Math.min(1, (this.vw - 60) / (c.measureText(text).width + size * .2)); // shrink to the visible width (portrait crop)
    c.translate(x, y); c.scale(s * fit, s * fit);
    c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
    c.lineWidth = size * .2; c.strokeStyle = '#1a0800'; c.strokeText(text, 0, 0);
    c.fillStyle = fill || goldGrad(c, 0, -size / 2, 0, size / 2); c.fillText(text, 0, 0); c.restore();
  }
  drawOverlay(c, t) {
    const o = this.overlay, el = t - o.t0;
    const fade = o.t1 ? 1 - clamp((t - o.t1) / .35, 0, 1) : clamp(el / .3, 0, 1);
    if (o.t1 && fade <= 0) { this.overlay = null; return; }
    c.save(); c.globalAlpha = fade;
    c.fillStyle = 'rgba(4,2,12,.72)'; c.fillRect(this.ox, this.oy, this.vw, H - this.oy);
    if (o.type === 'big') {
      this.rays(c, W / 2, 330, t, 1);
      const tier = BIG_WIN_TIERS[o.tier];
      const ts = Ease.outElastic(clamp((t - o.tierT) / .9, 0, 1));
      this.bigText(c, tier.name, W / 2, 250, 92, null, ts * (1 + .03 * Math.sin(t * 5)), FONT_T);
      this.bigText(c, tier.sub, W / 2, 330, 34, '#ffe9b0', ts, FONT_N);
      this.bigText(c, fmt(o.value), W / 2, 430, 84, '#ffffff', 1 + .02 * Math.sin(t * 9));
    } else if (o.type === 'fsIntro') {
      this.rays(c, W / 2, 300, t, 1, '255,150,60');
      this.bigText(c, 'GEM RUSH', W / 2, 190, 86, null, Ease.outBack(clamp(el / .6, 0, 1)), FONT_T);
      this.bigText(c, 'FREE SPINS', W / 2, 270, 52, '#ffe9b0', Ease.outBack(clamp((el - .15) / .6, 0, 1)));
      this.bigText(c, String(o.spins), W / 2, 380, 120, null, Ease.outElastic(clamp((el - .3) / 1, 0, 1)));
      c.font = `700 20px ${FONT_N}`; c.fillStyle = '#f2d48a'; c.textAlign = 'center';
      c.fillText('Every winning spin grows the Gem Multiplier', W / 2, 470);
      for (let k = 0; k < 4; k++) { // elephant herd crossing
        const x = ((el * 110 + k * 230) % (W + 320)) - 160, bob = Math.abs(Math.sin(el * 4 + k)) * 6;
        c.drawImage(this.art.tex.W, x - 70, 520 - bob, 140, 122);
      }
      if (el > 1.2) { c.globalAlpha = fade * (.6 + .4 * Math.sin(t * 4)); c.font = `800 18px ${FONT_N}`; c.fillStyle = '#fff'; c.fillText('TAP TO BEGIN', W / 2, 505); }
    } else if (o.type === 'fsOutro') {
      this.rays(c, W / 2, 330, t, 1, '255,180,90');
      this.bigText(c, 'GEM RUSH COMPLETE', W / 2, 230, 62, null, Ease.outBack(clamp(el / .6, 0, 1)), FONT_T);
      this.bigText(c, 'TOTAL WIN', W / 2, 320, 36, '#ffe9b0');
      this.bigText(c, fmt(o.value), W / 2, 410, 92, '#ffffff', 1 + .02 * Math.sin(t * 9));
      c.font = `700 20px ${FONT_N}`; c.fillStyle = '#f2d48a'; c.textAlign = 'center'; c.fillText(`${o.spins} free spins played`, W / 2, 490);
    }
    c.restore();
  }
}

/* ============================================================ GAME CONTROLLER
   Replays a book (event list) — identical code path for local demo and RGS.   */
class Game {
  constructor(view, provider) {
    this.view = view; this.provider = provider; this.engine = new MathEngine(CFG);
    this.betIdx = 2; this.balance = 0; this.busy = false; this.auto = false; this.turbo = false;
    this.autoCfg = null; this.autoLeft = 0; this.autoStartBal = 0;
    this.history = []; this.stats = { rounds: 0, bet: 0, won: 0 }; this.sessionStart = Date.now();
    this.skipping = false; this.waiters = new Set();
    view.reels.forEach(r => r.setStrip(CFG.strips.base[r.i], SecureRng.int(CFG.strips.base[r.i].length)));
  }
  get bet() { return BETS[this.betIdx]; }
  async init() { const a = await this.provider.authenticate(); this.balance = a.balance; ui.update(); }

  sleep(s) {
    if (this.skipping) return Promise.resolve();
    return new Promise(res => { const w = { res }; w.id = setTimeout(() => { this.waiters.delete(w); res(); }, s * 1000); this.waiters.add(w); });
  }
  skip() { this.skipping = true; for (const w of this.waiters) { clearTimeout(w.id); w.res(); } this.waiters.clear(); this.view.finishTweens(); }
  press() {
    audio.resume();
    if (this.auto) { this.stopAuto('AUTOPLAY STOPPED'); if (this.busy) this.skip(); return; }
    if (this.busy) this.skip(); else this.spin();
  }

  async spin(mode = 'base') {
    if (this.busy || (mode !== 'base' && this.auto)) return;
    if (this.bet * CFG.betModes[mode].cost > this.balance + 1e-9) { this.view.toast('INSUFFICIENT BALANCE', { size: 34, color: '#ff8a8a' }); this.stopAuto(); return; }
    if (this.auto) this.autoLeft--;
    this.busy = true; ui.update();
    const bet = this.bet;
    this.view.clearWins(); ui.setWin(0);
    let res;
    try { res = await this.provider.play(bet, mode); }
    catch (e) { console.error(e); this.view.toast('CONNECTION ERROR', { size: 34, color: '#ff8a8a' }); this.busy = false; ui.update(); return; }
    this.balance = res.balance; ui.update();
    try { await this.playBook(res.round.events, bet); }
    catch (e) { console.error('presentation error', e); }
    const end = await this.provider.endRound(bet, res.round);
    this.balance = end.balance;
    this.record(res.round, bet, mode);
    this.busy = false;
    if (this.auto) this.checkAutoLimits(res.round.payoutMultiplier / 100 * bet);
    ui.update();
    if (this.auto) { await new Promise(r => setTimeout(r, this.turbo ? 150 : 450)); if (this.auto && !this.busy) this.spin(); }
  }
  // History and session totals are read from the finished book; the client never alters outcomes.
  record(round, bet, mode = 'base') {
    const win = round.payoutMultiplier / 100 * bet, cost = bet * CFG.betModes[mode].cost;
    const fs = round.events.filter(e => e.type === 'reveal' && e.gameType === 'freegame').length;
    this.history.unshift({ time: new Date(), bet: cost, win, x: win / cost, fs, mode });
    if (this.history.length > 50) this.history.pop();
    this.stats.rounds++; this.stats.bet += cost; this.stats.won += win;
    ui.roundDone(win);
  }
  startAuto(cfg) {
    if (this.busy) return;
    this.autoCfg = cfg; this.autoLeft = cfg.count; this.autoStartBal = this.balance; this.auto = true;
    ui.update(); this.spin();
  }
  stopAuto(reason) {
    if (!this.auto) return;
    this.auto = false; ui.update();
    if (reason) this.view.toast(reason, { size: 30, color: '#ffe7a3', y: 650, dur: 2.2 });
  }
  // Responsible-gambling limits: spin count, loss limit (checked before the next bet is placed) and single-win limit.
  checkAutoLimits(won) {
    const c = this.autoCfg;
    if (this.autoLeft <= 0) this.stopAuto('AUTOPLAY COMPLETE');
    else if (this.autoStartBal - this.balance + this.bet > c.loss + 1e-9) this.stopAuto('LOSS LIMIT REACHED');
    else if (c.single && won >= c.single - 1e-9) this.stopAuto('WIN LIMIT REACHED');
    else if (this.bet > this.balance + 1e-9) this.stopAuto('INSUFFICIENT BALANCE');
  }

  async playBook(events, bet) {
    let shown = 0, fsTotal = 0, fsSpins = 0, inFs = false;
    for (const ev of events) {
      switch (ev.type) {
        case 'reveal':
          if (ev.gameType === 'freegame') {
            const h = this.view.fsHud; h.spin = ev.spin; h.spinPop = this.view.t;
            if (ev.multiplier !== h.mult) { h.mult = ev.multiplier; h.multPop = this.view.t; audio.multUp(); }
            await this.sleep(this.turbo ? .1 : .3);
          }
          await this.spinTo(ev);
          break;
        case 'elephantStampede':
          await this.stampede(ev);
          break;
        case 'winInfo': {
          await this.presentWin(ev, bet, shown, inFs);
          shown += ev.amount * bet;
          if (inFs) fsTotal += ev.amount * bet;
          break;
        }
        case 'freeSpinTrigger':
          if (this.auto && this.autoCfg.feature) this.stopAuto('AUTOPLAY STOPPED');
          await this.freeSpinIntro(ev);
          inFs = true; fsSpins = ev.totalFs;
          break;
        case 'freeSpinRetrigger':
          fsSpins += ev.added; this.view.fsHud.total = fsSpins; this.view.fsHud.spinPop = this.view.t;
          audio.scatterLand(5); this.view.toast(`+${ev.added} FREE SPINS`, { size: 58 });
          await this.sleep(1.4);
          break;
        case 'maxWinReached':
          this.view.toast('MAX WIN REACHED', { size: 60, dur: 2.4 }); await this.sleep(2);
          break;
        case 'finalWin':
          if (inFs) await this.freeSpinOutro(ev.amount * bet, this.view.fsHud.spin);
          ui.setWin(ev.amount * bet);
          if (ev.amount > 0) ui.announce(`You won ${fmt(ev.amount * bet)} FUN`);
          break;
      }
    }
  }

  async spinTo(ev) {
    this.skipping = false;
    const v = this.view, board = ev.board, turbo = this.turbo;
    v.clearWins();
    const vmax = turbo ? 42 : 27;
    audio.spinStart(); audio.spinLoop(true);
    v.reels.forEach((r, i) => r.start(v.t, i * (turbo ? .02 : .06), vmax));
    await this.sleep(turbo ? .3 : .62);
    let sc = 0, landedSc = 0, stopRiser = null;
    const lands = [];
    for (let i = 0; i < NR; i++) {
      const antic = !this.skipping && sc >= 2 && i >= 2;
      if (i > 0) {
        if (antic) {
          await Promise.all(lands); // build tension: previous reels settle first
          v.reels[i].antic = 1; for (let k = i + 1; k < NR; k++) v.reels[k].antic = 0;
          if (!stopRiser) stopRiser = audio.anticipation();
          await this.sleep(1.5);
        } else await this.sleep(turbo ? .06 : .15);
      }
      const reel = v.reels[i];
      lands.push(reel.requestStop(ev.stops[i], v.t, antic ? 7 : (this.skipping ? 2 : 4)).then(() => {
        reel.antic = 0;
        audio.reelStop(i);
        board[i].forEach((s, row) => {
          if (s === 'S') { landedSc++; reel.pop[row] = v.t; audio.scatterLand(landedSc); const [x, y] = v.cellCenter(i, row); v.burst(x, y, 26, 'cyan'); }
          if (s === 'W') { reel.pop[row] = v.t; const [x, y] = v.cellCenter(i, row); v.burst(x, y, 10, 'gold'); }
        });
      }));
      sc += board[i].filter(s => s === 'S').length;
    }
    await Promise.all(lands);
    if (stopRiser) stopRiser();
    audio.spinLoop(false);
  }

  async stampede(ev) {
    this.skipping = false;
    const v = this.view;
    audio.stampede(); v.shake(1.1, 7);
    v.toast('ELEPHANT STAMPEDE', { size: 56, dur: 1.8, y: 360 });
    for (const r of ev.reels) {
      v.charge(r);
      await this.sleep(this.turbo ? .2 : .45);
      v.reels[r].makeWild(v.t); audio.reelStop(r);
      for (let row = 0; row < NROW; row++) { const [x, y] = v.cellCenter(r, row); v.burst(x, y, 10, 'gold'); }
    }
    await this.sleep(this.turbo ? .2 : .55);
  }
  async presentWin(ev, bet, before, inFs) {
    this.skipping = false;
    const v = this.view, amt = ev.amount * bet, x = ev.amount;
    const list = ev.wins.map(w => {
      const line = CFG.paylines[w.line];
      return { line: w.line, cells: line.slice(0, w.count).map((row, r) => [r, row]), color: `hsl(${(w.line * 47) % 360},95%,62%)`,
               label: `LINE ${w.line + 1}  ·  ${fmt(w.pay / CFG.paylines.length * bet * (ev.multiplier || 1))}` };
    });
    if (ev.scatters.length >= 3) list.push({ line: null, cells: ev.scatters, color: '#9db8ff', label: `SCATTER  ·  ${fmt((CFG.scatterPays[ev.scatters.length] || 0) * bet * (ev.multiplier || 1))}` });
    v.showWins(list);
    list.forEach(w => w.cells.forEach(([r, row]) => { const [cx, cy] = v.cellCenter(r, row); v.burst(cx, cy, 8, 'gold'); }));
    if (inFs && ev.multiplier > 1) { v.toast(`x${ev.multiplier}`, { size: 110, dur: 1.1, y: 330 }); audio.multUp(); await this.sleep(.6); this.skipping = false; }
    if (x >= BIG_WIN_TIERS[0].at) { await this.bigWin(before, amt, x, bet); return; }
    audio.win(x < 1 ? 0 : x < 5 ? 1 : 2);
    const dur = clamp(.5 + x * .22, .5, 2.4) * (this.turbo ? .5 : 1) * (v.reduced ? .4 : 1);
    await this.countUp(before, before + amt, dur);
    await this.sleep(inFs ? .7 : .2);
  }
  countUp(from, to, dur) {
    let lastTick = 0;
    ui.flash(true);
    return this.view.tween(dur, u => {
      ui.setWin(lerp(from, to, u));
      if (this.view.t - lastTick > .06 && u < 1) { lastTick = this.view.t; audio.tick(); }
    }, Ease.outQuad).then(() => ui.flash(false));
  }
  async bigWin(before, amt, x, bet) {
    const v = this.view;
    const tierFor = val => { let k = 0; BIG_WIN_TIERS.forEach((tr, i) => { if (val / bet >= tr.at) k = i; }); return k; };
    v.overlay = { type: 'big', t0: v.t, tier: 0, tierT: v.t, value: 0 };
    v.coinShower(40); audio.bigWin();
    const dur = (3 + tierFor(amt) * 2.2) * (v.reduced ? .5 : 1);
    let lastTick = 0;
    await v.tween(dur, u => {
      const val = amt * u; v.overlay.value = val; ui.setWin(before + val);
      const k = tierFor(val);
      if (k > v.overlay.tier) { v.overlay.tier = k; v.overlay.tierT = v.t; audio.tierUp(); v.coinShower(50); }
      if (v.t - lastTick > .07 && u < 1) { lastTick = v.t; audio.tick(); }
    }, Ease.outCubic);
    v.overlay.value = amt;
    this.skipping = false;
    await this.sleep(2.6);
    v.overlay.t1 = v.t;
    this.skipping = false;
    await this.sleep(.4);
  }
  async freeSpinIntro(ev) {
    this.skipping = false;
    const v = this.view;
    v.showWins([{ line: null, cells: ev.positions, color: '#9db8ff', label: '' }]);
    audio.impact();
    await this.sleep(1.6);
    this.skipping = false;
    v.overlay = { type: 'fsIntro', t0: v.t, spins: ev.totalFs };
    audio.fanfare();
    await this.sleep(1.2); this.skipping = false;
    await this.sleep(this.auto ? 2.2 : 30);
    v.clearWins();
    v.setMode('free'); audio.startMusic('free');
    v.reels.forEach(r => r.setStrip(CFG.strips.free[r.i], SecureRng.int(CFG.strips.free[r.i].length)));
    v.fsHud = { spin: 0, total: ev.totalFs, mult: CFG.freeSpins.multiplierStart, spinPop: v.t, multPop: v.t };
    v.overlay.t1 = v.t;
    this.skipping = false;
    await this.sleep(.5);
  }
  async freeSpinOutro(total, spins) {
    this.skipping = false;
    const v = this.view;
    v.overlay = { type: 'fsOutro', t0: v.t, value: 0, spins };
    audio.fanfare(); v.coinShower(60);
    await v.tween(this.turbo ? 1 : 2.4, u => { v.overlay.value = total * u; }, Ease.outCubic);
    this.skipping = false;
    await this.sleep(this.auto ? 2 : 30);
    v.overlay.t1 = v.t; v.fsHud = null;
    v.setMode('base'); audio.startMusic('base');
    v.reels.forEach(r => r.setStrip(CFG.strips.base[r.i], SecureRng.int(CFG.strips.base[r.i].length)));
    v.clearWins();
    this.skipping = false;
    await this.sleep(.4);
  }
}

/* ============================================================ UI */
const $ = id => document.getElementById(id);
const audio = new SoundEngine();
let game, view;

// Player preferences: per-device convenience only, so localStorage is fine (and optional).
const prefs = Object.assign({ sfx: true, music: true, vol: .8, muted: false, turbo: false, space: true,
  reduced: matchMedia('(prefers-reduced-motion: reduce)').matches }, (() => { try { return JSON.parse(localStorage.getItem('iog.prefs')) || {}; } catch (e) { return {}; } })());
function savePrefs() { try { localStorage.setItem('iog.prefs', JSON.stringify(prefs)); } catch (e) { /* storage blocked */ } }
function applyPrefs() {
  audio.setSfx(prefs.sfx); audio.setMusic(prefs.music); audio.setVolume(prefs.muted ? 0 : prefs.vol);
  game.turbo = prefs.turbo; view.reduced = prefs.reduced; $('shell').classList.toggle('rm', prefs.reduced);
  ui.update();
}

const ui = {
  update() {
    if (!game) return;
    $('balance').textContent = fmt(game.balance);
    $('bet').textContent = fmt(game.bet);
    const lock = game.busy || game.auto;
    $('betDown').disabled = lock || game.betIdx === 0;
    $('betUp').disabled = lock || game.betIdx === BETS.length - 1;
    $('betVal').disabled = lock;
    $('btnBuy').disabled = lock;
    const sp = $('spin');
    sp.classList.toggle('stop', game.busy && !game.auto); sp.classList.toggle('auto', game.auto);
    sp.setAttribute('aria-label', game.auto ? `Stop autoplay, ${game.autoLeft} spins left` : game.busy ? 'Skip animation' : 'Spin');
    $('autoLeft').textContent = game.auto ? game.autoLeft : '';
    $('autoLbl').textContent = game.auto ? `Stop ${game.autoLeft}` : 'Auto';
    $('btnAuto').setAttribute('aria-pressed', game.auto); $('btnAuto').setAttribute('aria-label', game.auto ? 'Stop autoplay' : 'Autoplay');
    $('btnTurbo').setAttribute('aria-pressed', game.turbo);
    $('btnMute').setAttribute('aria-pressed', prefs.muted); $('btnMute').setAttribute('aria-label', prefs.muted ? 'Unmute sound' : 'Mute sound');
  },
  setWin(v) { $('win').textContent = fmt(v); },
  flash(on) { $('winBox').classList.toggle('flash', on); },
  announce(text) { $('live').textContent = ''; setTimeout(() => { $('live').textContent = text; }, 30); },
  roundDone() { if (!$('menu').hidden && menuTab === 'history') renderHistory(); },
};

/* ---- modal sheets: one stack, Escape and backdrop close, Tab stays inside, focus returns to the opener */
const FOCUSABLE = 'button:not(:disabled), input, [href], [tabindex]:not([tabindex="-1"])';
const modal = {
  stack: [],
  open(id, opener) {
    const el = $(id); el.hidden = false;
    this.stack.push({ el, opener: opener || document.activeElement });
    const f = el.querySelector('[data-autofocus]') || el.querySelector(FOCUSABLE); f && f.focus();
  },
  close() {
    const top = this.stack.pop(); if (!top) return;
    top.el.hidden = true; if (top.opener && top.opener.focus) top.opener.focus();
  },
  trap(e) {
    const top = this.stack[this.stack.length - 1]; if (!top) return;
    const f = [...top.el.querySelectorAll(FOCUSABLE)].filter(x => x.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  },
};

/* ---- menu: Paytable | History | Settings */
let menuTab = 'paytable';
function openMenu(tab, opener) { selectTab(tab); modal.open('menu', opener); $('tb-' + tab).focus(); }
function selectTab(tab) {
  menuTab = tab;
  for (const name of ['paytable', 'history', 'settings']) {
    const on = name === tab;
    $('tb-' + name).setAttribute('aria-selected', on); $('tb-' + name).tabIndex = on ? 0 : -1; $('tab-' + name).hidden = !on;
  }
  ({ paytable: renderPaytable, history: renderHistory, settings: renderSettings })[tab]();
  $('tab-' + tab).parentElement.scrollTop = 0;
}

const pct = x => `${(x * 100).toFixed(2)}%`;
const buyModes = () => Object.entries(CFG.betModes).filter(([, c]) => c.buy);
const buyText = (m, c) => c.multiplierStart ? `Gem Rush Free Spins with the Gem Multiplier starting at x${c.multiplierStart}.` : 'Gem Rush Free Spins right away, the same bonus as landing 3 or more Lion Rock scatters.';

/* ---- Buy Gem Rush: pick a mode, then confirm the exact price */
function renderBuy() {
  const b = game.bet;
  $('buyBody').innerHTML = `<div class="buycards">${buyModes().map(([m, c]) => {
    const price = c.cost * b, ok = price <= game.balance + 1e-9;
    return `<div class="bcard"><h3>${c.label}</h3><p>${buyText(m, c)}</p>
      <div class="price">${fmt(price)}<small>FUN · ${c.cost}x bet</small></div>
      <div class="note" style="margin:0">RTP ${pct(c.rtp)}</div>
      <button class="cta" data-buy="${m}" ${ok ? '' : 'disabled'}>${ok ? `Buy for ${fmt(price)}` : 'Balance too low'}</button></div>`;
  }).join('')}</div><p class="note">Prices follow your total bet (${fmt(b)} FUN). Change the bet to change the price.</p>`;
}
function renderBuyConfirm(m) {
  const c = CFG.betModes[m], price = c.cost * game.bet;
  $('buyBody').innerHTML = `<div class="confirm"><h3>Buy ${c.label}?</h3><div class="price">${fmt(price)} FUN</div>
    <p class="note" style="margin-top:0">${buyText(m, c)} RTP ${pct(c.rtp)}.</p>
    <div class="row2"><button class="ghost" data-back>Back</button><button class="cta" data-confirm="${m}" data-autofocus>Buy now</button></div></div>`;
  $('buyBody').querySelector('[data-confirm]').focus();
}

let symbolArt = null;
function renderPaytable() {
  const n = CFG.paylines.length, bet = game.bet;
  symbolArt = symbolArt || Object.fromEntries(Object.keys(SYMBOL_PAINTERS).map(s => [s, view.art.tex[s].toDataURL()]));
  const card = (s, name, rows, cls = '') => `<div class="sym ${cls}"><img alt="" src="${symbolArt[s]}"><div><div class="nm">${name}</div>${rows}</div></div>`;
  const cards = ['W', 'H1', 'H2', 'H3', 'H4', 'H5', 'L1', 'L2', 'L3', 'L4'].map(s =>
    card(s, CFG.symbols[s].name, [5, 4, 3].map(k => `<div><span>${k}</span>${fmt(CFG.linePays[s][k] / n * bet)}</div>`).join(''))).join('');
  const sc = card('S', `${CFG.symbols.S.name} (scatter)`, [5, 4, 3].map(k => `<div><span>${k}</span>${fmt(CFG.scatterPays[k] * bet)} + ${CFG.freeSpins.award[k]} free spins</div>`).join(''), 'wide');
  const lines = CFG.paylines.map((l, i) => `<figure><svg viewBox="0 0 50 34" aria-hidden="true"><rect width="50" height="34" rx="4" fill="#0a1230"/>${
    l.map((row, r) => `<rect x="${r * 10 + 1}" y="${row * 11 + 1}" width="8" height="9" rx="1.5" fill="hsl(${(i * 47) % 360},90%,60%)"/>`).join('')}</svg>Line ${i + 1}</figure>`).join('');
  $('tab-paytable').innerHTML = `
    <h3>Symbols <small style="color:var(--mist);font-family:var(--f-ui);font-size:12px;letter-spacing:0">pays for a total bet of ${fmt(bet)} FUN</small></h3>
    <div class="pt-grid">${cards}${sc}</div>
    <h3>Features</h3>
    <ul>
      <li><b>Golden Elephant</b> is wild. It substitutes for every symbol except the Lion Rock scatter, and pays on its own.</li>
      <li>3, 4 or 5 <b>Lion Rock</b> scatters anywhere pay and award ${CFG.freeSpins.award[3]}, ${CFG.freeSpins.award[4]} or ${CFG.freeSpins.award[5]} <b>Gem Rush Free Spins</b>.</li>
      <li>In free spins every win is multiplied by the <b>Gem Multiplier</b>. It starts at x${CFG.freeSpins.multiplierStart} and grows by ${CFG.freeSpins.multiplierStep} after every winning spin, up to x${CFG.freeSpins.multiplierMax}. Free spins can retrigger.</li>
      <li>On any base-game spin an <b>Elephant Stampede</b> can charge in (about 1 in ${Math.round(CFG.stampede.chance[1] / CFG.stampede.chance[0])} spins) and turn 1 to 3 of reels ${new Intl.ListFormat('en', { type: 'conjunction' }).format(CFG.stampede.reels.map(r => String(r + 1)))} fully wild. It never covers a Lion Rock scatter.</li>
      <li>The maximum win is <b>${CFG.maxWinMultiplier.toLocaleString('en-US')}x</b> the base bet. The round ends when it is reached.</li>
    </ul>
    <h3>Buy Gem Rush</h3>
    <ul>
      ${buyModes().map(([m, c]) => `<li><b>${c.label}</b> costs ${c.cost}x the bet (${fmt(c.cost * bet)} FUN): ${buyText(m, c)} RTP ${pct(c.rtp)}.</li>`).join('')}
    </ul>
    <h3>Paylines (${n})</h3>
    <div class="pt-lines">${lines}</div>
    <h3>Rules</h3>
    <p>Wins pay left to right on adjacent reels, starting from the leftmost reel. Only the highest win per line is paid. Line wins are shown for the current total bet.
    Theoretical RTP: ${pct(CFG.betModes.base.rtp)} for the base game${buyModes().map(([, c]) => `, ${pct(c.rtp)} for ${c.label}`).join('')}. A malfunction voids all pays and plays.</p>`;
}

const clock = d => d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
const signed = v => `${v > 0 ? '+' : v < 0 ? '−' : ''}${fmt(Math.abs(v))}`;
function renderHistory() {
  const s = game.stats, net = s.won - s.bet;
  const rows = game.history.map(r => `<tr><td>${clock(r.time)}</td><td class="num">${fmt(r.bet)}</td>
    <td class="num ${r.win > 0 ? 'pos' : ''}">${fmt(r.win)}</td>
    <td>${r.mode && r.mode !== 'base' ? `<span class="tag">${CFG.betModes[r.mode].label}</span> ` : ''}${r.fs ? `<span class="tag">Gem Rush · ${r.fs} spins</span> ` : ''}${r.win > 0 ? `${r.x.toFixed(2)}x` : 'No win'}</td></tr>`).join('');
  $('tab-history').innerHTML = `
    <div class="summary">
      <div><span class="lbl">Rounds</span><b>${s.rounds}</b></div>
      <div><span class="lbl">Total bet</span><b>${fmt(s.bet)}</b></div>
      <div><span class="lbl">Total won</span><b>${fmt(s.won)}</b></div>
      <div><span class="lbl">Net</span><b class="${net > 0 ? 'pos' : net < 0 ? 'neg' : ''}">${signed(net)}</b></div>
    </div>
    ${rows ? `<table class="hist"><thead><tr><th>Time</th><th class="num">Bet</th><th class="num">Win</th><th>Result</th></tr></thead><tbody>${rows}</tbody></table>
      <p class="note">Shows your last 50 rounds this session. Amounts are in FUN.</p>`
      : '<div class="empty">No rounds yet. Your spins this session will appear here.</div>'}`;
}

const SETTINGS = [
  ['sfx', 'Sound effects', 'Reel stops, wins and gem chimes'],
  ['music', 'Music', 'Hand drums and reed horn'],
  ['turbo', 'Turbo spin', 'Faster reels and shorter win counts'],
  ['space', 'Spin with the space bar', 'Space also skips animations'],
  ['reduced', 'Reduced motion', 'Turns off fireflies, embers, coin showers and the title shimmer, and shortens win counts'],
];
function renderSettings() {
  $('tab-settings').innerHTML = `
    <div class="row"><span><label for="vol">Volume</label><span class="hint">Master level for effects and music</span></span>
      <input type="range" id="vol" min="0" max="1" step=".05" value="${prefs.muted ? 0 : prefs.vol}"></div>
    ${SETTINGS.map(([k, name, hint]) => `<div class="row"><span id="lb-${k}">${name}<span class="hint">${hint}</span></span>
      <button class="switch" role="switch" data-pref="${k}" aria-checked="${prefs[k]}" aria-labelledby="lb-${k}"></button></div>`).join('')}
    <p class="note">Demo mode. Play money (FUN) only, with no cash value. Session started at ${clock(new Date(game.sessionStart))}.</p>`;
}

/* ---- autoplay with limits (required before autoplay can start) */
const AUTO = { count: [10, 25, 50, 100, 250], loss: [10, 25, 50, 100], single: [0, 20, 50, 100] };
const autoSel = { count: 25, loss: 50, single: 0, feature: true };
function renderAuto() {
  const b = game.bet;
  const chips = (key, label) => AUTO[key].map(v => `<button class="chip" data-k="${key}" data-v="${v}" aria-pressed="${autoSel[key] === v}">${label(v)}</button>`).join('');
  $('autoBody').innerHTML = `
    <div class="field"><div class="flabel" id="al-count">Number of spins</div><div class="chips" role="group" aria-labelledby="al-count">${chips('count', v => v)}</div></div>
    <div class="field"><div class="flabel" id="al-loss">Stop if balance drops by</div><div class="chips" role="group" aria-labelledby="al-loss">${chips('loss', v => fmt(v * b))}</div></div>
    <div class="field"><div class="flabel" id="al-single">Stop if a single win reaches</div><div class="chips" role="group" aria-labelledby="al-single">${chips('single', v => v ? fmt(v * b) : 'Off')}</div></div>
    <div class="row"><span id="al-feature">Stop when Gem Rush Free Spins start</span><button class="switch" role="switch" data-k="feature" aria-checked="${autoSel.feature}" aria-labelledby="al-feature"></button></div>
    <button class="cta wide" id="autoGo" data-autofocus>Start ${autoSel.count} spins</button>
    <p class="note">Total bet ${fmt(b)} FUN per spin. Tap the spin gem or press Space at any time to stop.</p>`;
}

function renderBets() {
  $('betBody').innerHTML = `<div class="chips" role="group" aria-label="Total bet">${BETS.map((v, i) =>
    `<button class="chip" data-i="${i}" aria-pressed="${i === game.betIdx}" ${i === game.betIdx ? 'data-autofocus' : ''}>${fmt(v)}</button>`).join('')}</div>
    <p class="note">Amounts are in FUN. Line pays in the paytable update with the bet.</p>`;
}

function tickSession() {
  if (!game) return;
  const m = Math.floor((Date.now() - game.sessionStart) / 1000), net = game.stats.won - game.stats.bet;
  $('session').innerHTML = `${new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}<i>·</i>Session ${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}<i>·</i>Net ${signed(net)}`;
}

async function boot() {
  try { await Promise.race([Promise.all([document.fonts.load(`900 40px "Cinzel"`), document.fonts.load(`900 40px "Cinzel Decorative"`), document.fonts.load(`800 16px "Manrope"`)]), new Promise(r => setTimeout(r, 2500))]); } catch (e) { /* offline: fall back to system fonts */ }
  const art = buildTextures();
  view = new View($('stage'), art);
  game = new Game(view, new LocalDemoProvider(new MathEngine(CFG)));
  await game.init();
  applyPrefs();
  view.startLoop();
  tickSession(); setInterval(tickSession, 1000);
  $('loading').hidden = true; $('btnStart').hidden = false; $('btnStart').focus();

  const click = () => audio.click();
  $('btnStart').onclick = () => { audio.init(); audio.resume(); audio.startMusic('base'); $('start').hidden = true; $('spin').focus(); };
  $('spin').onclick = () => { click(); game.press(); };
  $('stage').addEventListener('pointerdown', () => { if (game.busy) game.skip(); });
  const stepBet = d => { if (!game.busy && !game.auto) { game.betIdx = clamp(game.betIdx + d, 0, BETS.length - 1); click(); ui.update(); } };
  $('betUp').onclick = () => stepBet(1);
  $('betDown').onclick = () => stepBet(-1);
  $('betVal').onclick = e => { click(); renderBets(); modal.open('betSheet', e.currentTarget); };
  $('betBody').onclick = e => { const b = e.target.closest('[data-i]'); if (!b) return; game.betIdx = +b.dataset.i; click(); ui.update(); modal.close(); };
  $('btnAuto').onclick = e => { click(); if (game.auto) game.stopAuto('AUTOPLAY STOPPED'); else { renderAuto(); modal.open('autoSheet', e.currentTarget); } };
  $('autoBody').onclick = e => {
    const chip = e.target.closest('[data-k]'); if (!chip) return;
    click();
    const k = chip.dataset.k;
    autoSel[k] = k === 'feature' ? !autoSel.feature : +chip.dataset.v;
    renderAuto(); $('autoBody').querySelector(k === 'feature' ? '[data-k="feature"]' : `[data-k="${k}"][data-v="${autoSel[k]}"]`).focus();
  };
  $('autoBody').addEventListener('click', e => {
    if (e.target.id !== 'autoGo') return;
    const b = game.bet;
    modal.close();
    game.startAuto({ count: autoSel.count, loss: autoSel.loss * b, single: autoSel.single * b, feature: autoSel.feature });
  });
  $('btnTurbo').onclick = () => { click(); prefs.turbo = !prefs.turbo; savePrefs(); applyPrefs(); };
  $('btnBuy').onclick = e => { click(); renderBuy(); modal.open('buySheet', e.currentTarget); };
  $('buyBody').onclick = e => {
    const pick = e.target.closest('[data-buy]'), back = e.target.closest('[data-back]'), go = e.target.closest('[data-confirm]');
    if (pick) { click(); renderBuyConfirm(pick.dataset.buy); }
    else if (back) { click(); renderBuy(); $('buyBody').querySelector('[data-buy]')?.focus(); }
    else if (go) { click(); modal.close(); game.spin(go.dataset.confirm); }
  };
  $('btnMute').onclick = () => { prefs.muted = !prefs.muted; savePrefs(); applyPrefs(); click(); };
  $('btnMenu').onclick = e => { click(); openMenu(menuTab, e.currentTarget); };
  document.querySelectorAll('.tab').forEach(tb => { tb.onclick = () => { click(); selectTab(tb.dataset.tab); }; });
  $('menu').querySelector('.tabs').addEventListener('keydown', e => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    const names = ['paytable', 'history', 'settings'], i = names.indexOf(menuTab) + (e.key === 'ArrowRight' ? 1 : -1);
    selectTab(names[(i + 3) % 3]); $('tb-' + menuTab).focus();
  });
  $('tab-settings').addEventListener('click', e => {
    const sw = e.target.closest('[data-pref]'); if (!sw) return;
    const k = sw.dataset.pref; prefs[k] = !prefs[k]; savePrefs(); applyPrefs(); sw.setAttribute('aria-checked', prefs[k]); click();
  });
  $('tab-settings').addEventListener('input', e => {
    if (e.target.id !== 'vol') return;
    prefs.vol = +e.target.value; prefs.muted = prefs.vol === 0; savePrefs(); applyPrefs();
  });
  document.querySelectorAll('[data-close]').forEach(b => { b.onclick = () => { click(); modal.close(); }; });
  document.querySelectorAll('.overlay[role="dialog"]').forEach(o => o.addEventListener('click', e => { if (e.target === o) modal.close(); }));
  const spaceOk = e => e.code === 'Space' && prefs.space && !modal.stack.length && $('start').hidden && e.target.tagName !== 'INPUT';
  addEventListener('keydown', e => {
    if (e.code === 'Escape' && modal.stack.length) { e.preventDefault(); modal.close(); return; }
    if (e.key === 'Tab' && modal.stack.length) { modal.trap(e); return; }
    if (spaceOk(e)) { e.preventDefault(); if (!e.repeat) game.press(); }
  });
  addEventListener('keyup', e => { if (spaceOk(e)) e.preventDefault(); }); // stop Space from also clicking the focused button
  ui.update();
}
boot();
</script>
