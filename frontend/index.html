<style>
  :root {
    --bg: #05070d;
    --panel: rgba(17, 29, 40, .92);
    --panel-line: #2a4152;
    --text: #e8eef5;
    --muted: #8aa0b4;
    --accent: #1fd36b;
    --gold: #f5c542;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; }
  #wrap { position: fixed; inset: 0; display: grid; place-items: center; }
  #game { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; container-type: inline-size; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }

  #hud { position: absolute; left: 0; right: 0; bottom: 0; height: 17%; display: flex; align-items: center; justify-content: center;
    gap: 1.1cqw; padding: 0 2cqw; background: linear-gradient(to bottom, transparent, rgba(4, 7, 14, .88) 45%); }
  .stat { background: var(--panel); border: 1px solid var(--panel-line); border-radius: .8cqw; padding: .55cqw 1.1cqw; min-width: 12.5cqw; }
  .stat label { display: block; font-size: .8cqw; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; font-weight: 600; }
  .stat b { font-size: 1.65cqw; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stat small { font-size: .9cqw; color: var(--muted); margin-left: .3cqw; }
  #win.flash { color: var(--gold); text-shadow: 0 0 1cqw rgba(245, 197, 66, .7); }
  .betrow { display: flex; align-items: center; gap: .6cqw; }
  .betrow b { min-width: 6cqw; text-align: center; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .sq { width: 2.3cqw; height: 2.3cqw; border-radius: .5cqw; background: #22384a; font-size: 1.4cqw; line-height: 1; display: grid; place-items: center; }
  .sq:hover { background: #2d4a61; }
  .sq:disabled { opacity: .35; cursor: default; }
  .icon { width: 3.6cqw; height: 3.6cqw; border-radius: 50%; background: var(--panel); border: 1px solid var(--panel-line); font-size: 1.4cqw; font-weight: 800; font-family: Georgia, serif; }
  .toggles { display: flex; gap: .6cqw; }
  .tog { height: 3.6cqw; padding: 0 1.1cqw; border-radius: .7cqw; background: var(--panel); border: 1px solid var(--panel-line); font-size: .95cqw; font-weight: 800; letter-spacing: .08em; color: var(--muted); }
  .tog.on { color: #04140a; background: var(--accent); border-color: var(--accent); }
  #spin { width: 8cqw; height: 8cqw; border-radius: 50%; position: relative; margin: 0 .8cqw;
    background: radial-gradient(circle at 35% 30%, #7dffb2 0%, #19c45d 45%, #0b7f3a 100%);

    transition: transform .12s ease, filter .2s; }
  #spin:hover { filter: brightness(1.08); }
  #spin:active { transform: scale(.94); }
  #spin svg { width: 55%; height: 55%; transition: transform .6s cubic-bezier(.2, .8, .2, 1); }
  #spin.busy svg { animation: rot .55s linear infinite; }
  #spin.stop { background: radial-gradient(circle at 35% 30%, #ffd77a 0%, #e9a51c 50%, #8a5a06 100%); box-shadow: 0 0 0 .35cqw #2a1d04, 0 0 0 .55cqw #ffcf4a, 0 .6cqw 1.6cqw rgba(0, 0, 0, .6); }

  .overlay.hidden { display: none; }
  #start .card { text-align: center; }
  #start h1 { font-family: "Cinzel Decorative", Georgia, serif; font-size: 4.2cqw; margin: 0;

    filter: drop-shadow(0 .3cqw .6cqw rgba(0, 0, 0, .7)); }
  #start .tagline { font-family: "Cinzel", Georgia, serif; letter-spacing: .12em; color: #f2d48a; font-size: 1.5cqw; margin: .4cqw 0 2.4cqw; }
  #start button { font-size: 1.6cqw; font-weight: 800; letter-spacing: .15em; padding: 1.1cqw 3.4cqw; border-radius: 3cqw; color: #04140a;
    background: linear-gradient(#5dffa0, #17b856); box-shadow: 0 0 2cqw rgba(31, 211, 107, .45); }

  #loading { color: var(--muted); font-size: 1.1cqw; letter-spacing: .1em; }

  #paytable h3 { font-family: "Cinzel", Georgia, serif; color: #f2d48a; font-size: 1.3cqw; margin: 1.8cqw 0 .6cqw; }
  #paytable .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1cqw; }
  #paytable .sym { background: #13222f; border: 1px solid #22384a; border-radius: .8cqw; padding: .6cqw; display: flex; gap: .8cqw; align-items: center; }
  #paytable .sym img { width: 6.5cqw; height: auto; }
  #paytable .sym .nm { font-size: .85cqw; color: var(--muted); margin-bottom: .2cqw; }
  #paytable .sym div { font-size: 1cqw; line-height: 1.45; font-variant-numeric: tabular-nums; }
  #paytable .sym span { color: var(--gold); font-weight: 700; display: inline-block; width: 1.6cqw; }
  #paytable p, #paytable li { font-size: 1.05cqw; line-height: 1.6; color: #c6d3df; }
  #paytable .close { position: absolute; top: 1.2cqw; right: 1.4cqw; }
  #paytable svg { width: 100%; height: auto; }
</style>

/* ----------------------------------------------------------------- utils */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ============================================================ MATH ENGINE

class MathEngine {
  constructor(cfg) {

  draw(rng, mode) {

    const stops = strips.map(s => rng.int(s.length));

    const baseWin = e.total;
    events.push({ type: 'reveal', gameType: 'basegame', stops: d.stops, board: d.board });
    if (e.wins.length || baseWin) events.push({ type: 'winInfo', wins: e.wins, scatters: e.scatters, amount: r4(baseWin) });
    let freeWin = 0;
    const nSc = e.scatters.length;
    if (nSc >= 3) {
      let left = this.fs.award[Math.min(nSc, 5)], mult = this.fs.multiplierStart, spin = 0;
      events.push({ type: 'freeSpinTrigger', totalFs: left, positions: e.scatters });
      while (left > 0) {
        left--; spin++;
        d = this.draw(rng, 'free');
        e = this.evaluate(d.board);
        const win = e.total * mult;
        freeWin += win;
        events.push({ type: 'reveal', gameType: 'freegame', stops: d.stops, board: d.board, spin, multiplier: mult });
        if (e.total) events.push({ type: 'winInfo', wins: e.wins, scatters: e.scatters, multiplier: mult, amount: r4(win) });
        if (e.total > 0) mult = Math.min(mult + this.fs.multiplierStep, this.fs.multiplierMax);
        if (e.scatters.length >= 3) {
          const add = this.fs.retrigger[Math.min(e.scatters.length, 5)];
          left += add;
          events.push({ type: 'freeSpinRetrigger', added: add, positions: e.scatters });
        }
        if (baseWin + freeWin >= this.maxWin) break;
      }
    }
    let total = baseWin + freeWin;
    if (total >= this.maxWin) { total = this.maxWin; events.push({ type: 'maxWinReached', amount: total }); }
    events.push({ type: 'finalWin', amount: r4(total) });
    return { payoutMultiplier: Math.round(total * 100), events };
  }
}

/* ======================================================= OUTCOME PROVIDERS
   Production: StakeRGSProvider. Outcomes come from pre-generated books on the RGS;
   the client NEVER decides results. LocalDemoProvider exists only for dev/demo.   */
class LocalDemoProvider {
  constructor(engine) { this.engine = engine; this.balance = 1000; this.forced = []; }
  async authenticate() { return { balance: this.balance, currency: 'FUN' }; }
  // QA only: queue the next round matching a predicate, e.g. r => r.events.some(e => e.type === 'freeSpinTrigger').
  force(pred, tries = 500000) {
    for (let i = 0; i < tries; i++) { const r = this.engine.playRound(SecureRng); if (pred(r)) { this.forced.push(r); return r.payoutMultiplier / 100; } }
    return null;
  }
  async play(bet) {
    if (bet > this.balance + 1e-9) throw new Error('INSUFFICIENT_FUNDS');
    this.balance -= bet;
    const round = this.forced.shift() || this.engine.playRound(SecureRng);
    return { round, balance: this.balance };
  }
  async endRound(bet, round) { this.balance += round.payoutMultiplier / 100 * bet; return { balance: this.balance }; }
}

class StakeRGSProvider {
  // Skeleton of the Stake Engine RGS flow. Confirm endpoint names, amount scaling and
  // response shapes against the current Stake Engine docs before wiring this in.
  constructor() {
    const q = new URLSearchParams(location.search);
    this.rgs = q.get('rgs_url'); this.session = q.get('sessionID'); this.lang = q.get('lang') || 'en';
  }
  async post(path, body) {
    const r = await fetch(`https://${this.rgs}${path}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error(`RGS ${path} ${r.status}`);
    return r.json();
  }
  async authenticate() { return this.post('/wallet/authenticate', { sessionID: this.session, language: this.lang }); }
  async play(bet, mode = 'base') { return this.post('/wallet/play', { sessionID: this.session, amount: Math.round(bet * 1e6), mode }); }
  async endRound() { return this.post('/wallet/end-round', { sessionID: this.session }); }
}

    this.music = ctx.createGain(); this.music.gain.value = .3; this.music.connect(this.master);

    return () => { const n = this.t; g.gain.setTargetAtTime(.0001, n, .06); [o, o2, lfo].forEach(x => x.stop(n + .4)); };
  }
  win(level) {
    if (!this.ok()) return;
    const notes = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5, 1567.98];
    const n = [3, 5, 9][clamp(level, 0, 2)];
    for (let i = 0; i < n; i++) {
      const t = this.t + i * .075;

  }
  tick() { if (!this.ok()) return; this.osc({ f: 2000 + Math.random() * 300, dur: .03, gain: .035 }); }
  coin() { if (!this.ok()) return; const f = 2300 + Math.random() * 1400; this.osc({ f, dur: .16, gain: .035 }); this.osc({ f: f * 1.5, dur: .1, gain: .02 }); }
  bigWin() {
    if (!this.ok()) return;
    for (let i = 0; i < 18; i++) this.noise({ t: this.t + i * .045, dur: .07, f: 180, q: .7, type: 'lowpass', gain: .12 + i * .012 });

  tierUp() {

  multUp() { if (!this.ok()) return; this.osc({ type: 'triangle', f: 440, f2: 990, dur: .3, gain: .14 }); this.chime(1320, { t: this.t + .12, gain: .1, dur: 1.4 }); }

  dhum(t, out, gain = .5) { this.osc({ f: 125, f2: 50, t, dur: .38, gain, out }); this.noise({ t, dur: .05, type: 'lowpass', f: 500, gain: gain * .25, out }); }

    fl.type = 'bandpass'; fl.frequency.value = f * 2.2; fl.Q.value = 1.6;

    o.connect(fl).connect(g).connect(out);

  }
  startMusic(mode) {

  }
  schedule() {
    if (!this.ok()) return;
    const free = this.mode === 'free', sp = 60 / (free ? 118 : 90) / 4, out = this.music;
    const reed = [587.33, 622.25, 739.99, 783.99, 880, 932.33, 1108.73, 1174.66]; // D double-harmonic
    const phrase = [0, -1, 2, -1, 3, 4, -1, 3, 2, -1, 1, 0, -1, -1, 2, -1, 4, -1, 5, 4, 3, -1, 2, 3, 2, -1, 1, -1, 0, -1, -1, -1];
    while (this.next < this.t + .12) {
      const s = this.step, p = s % 16, t = this.next;
      if (free) {
        if ([0, 3, 6, 8, 10, 13].includes(p)) this.dhum(t, out, .5);
        if (p === 4 || p === 12) this.tha(t, out, .26);
        if (p % 2) this.ta(t, out, .07);
        if (phrase[s] >= 0) this.horn(reed[phrase[s]], t, sp * 1.9, out, .045);
      } else {
        if ([0, 6, 10].includes(p)) this.dhum(t, out, .38);
        if (p === 4 || p === 12) this.tha(t, out, .16);
        if ([2, 7, 14, 15].includes(p)) this.ta(t, out, .045);
        if (p % 8 === 0 && Math.random() < .45) {
          const f = [293.66, 329.63, 369.99, 440, 493.88, 587.33][Math.floor(Math.random() * 6)];
          this.osc({ f, t, dur: 1.4, gain: .05, attack: .08, out, verb: .5 });
          this.osc({ f: f * 2, t, dur: .9, gain: .012, attack: .08, out });
        }
      }
      this.next += sp; this.step = (this.step + 1) % 32;
    }
  }
}

function drawFaceted(c, cx, cy, rx, ry, n, rot, col) {
  const P = (s, i, off = 0) => { const a = rot + (i + off) * TAU / n; return [cx + Math.cos(a) * rx * s, cy + Math.sin(a) * ry * s]; };
  const LA = -Math.PI * .72;
  c.save(); c.shadowColor = 'rgba(0,0,0,.55)'; c.shadowBlur = 12; c.shadowOffsetY = 6;
  poly(c, Array.from({ length: n }, (_, i) => P(1.07, i))); c.fillStyle = goldGrad(c, cx - rx, cy - ry, cx + rx, cy + ry); c.fill();
  c.restore();
  const offs = [.12, -.08, .3, -.2];
  for (let i = 0; i < n; i++) {
    const o0 = P(1, i), o1 = P(1, i + 1), t0 = P(.52, i), t1 = P(.52, i + 1), m = P(.8, i, .5);
    const tris = [[o0, o1, m], [o1, t1, m], [t1, t0, m], [t0, o0, m]];
    tris.forEach((tri, k) => {
      const gx = (tri[0][0] + tri[1][0] + tri[2][0]) / 3 - cx, gy = (tri[0][1] + tri[1][1] + tri[2][1]) / 3 - cy;
      const s = .5 + .5 * Math.cos(Math.atan2(gy, gx) - LA);
      poly(c, tri); c.fillStyle = mix(col.dark, col.light, s * .85 + offs[k] + (i % 2 ? .06 : -.04)); c.fill();
      c.strokeStyle = 'rgba(255,255,255,.22)'; c.lineWidth = .8; c.stroke();
    });
  }
  const tb = Array.from({ length: n }, (_, i) => P(.52, i));
  const tg = c.createLinearGradient(cx - rx * .5, cy - ry * .5, cx + rx * .5, cy + ry * .5);
  tg.addColorStop(0, col.light); tg.addColorStop(.55, col.base); tg.addColorStop(1, col.dark);
  poly(c, tb); c.fillStyle = tg; c.globalAlpha = .85; c.fill(); c.globalAlpha = 1;
  c.strokeStyle = 'rgba(255,255,255,.35)'; c.stroke();
  poly(c, Array.from({ length: n }, (_, i) => P(1, i))); c.lineWidth = 2; c.strokeStyle = col.dark; c.stroke();
  for (let i = 0; i < n; i += n / 4) { const [x, y] = P(1.03, i); c.fillStyle = goldGrad(c, x - 4, y - 4, x + 4, y + 4); c.beginPath(); c.arc(x, y, 4, 0, TAU); c.fill(); }
  c.save(); c.globalAlpha = .55; c.fillStyle = '#fff'; c.beginPath(); c.ellipse(cx - rx * .25, cy - ry * .28, rx * .16, ry * .07, -.6, 0, TAU); c.fill(); c.restore();
  sparkle(c, cx - rx * .42, cy - ry * .5, 10, .95);
  sparkle(c, cx + rx * .4, cy + ry * .3, 5, .6);
}

function buildTextures() {

/* ============================================================ REEL */
class Reel {
  constructor(i) { this.i = i; this.top = 0; this.offset = 0; this.state = 'idle'; this.speed = 0; this.vel = 0; this.over = new Map(); this.pop = [0, 0, 0]; this.antic = 0; }
  setStrip(strip, stop) { this.strip = strip; this.offset = stop; this.top = 0; this.over.clear(); }
  symAt(j) { if (this.over.has(j)) return this.over.get(j); const L = this.strip.length; return this.strip[(((j + this.offset) % L) + L) % L]; }
  start(t, delay, vmax) { this.state = 'wait'; this.t0 = t + delay; this.vmax = vmax; this.top0 = this.top; this.pop = [0, 0, 0]; }
  requestStop(stop, t, extra) {
    const F = Math.floor(this.top) - extra;
    const L = this.strip.length;
    for (let k = -1; k <= 3; k++) this.over.set(F + k, this.strip[(((stop + k) % L) + L) % L]);
    this.stopFrom = this.top; this.dist = this.top - F; this.F = F; this.finalStop = stop;
    this.dur = this.dist * LAND_D0 / this.vmax; this.ts = t; this.state = 'stopping';
    return new Promise(res => { this.onLand = res; });
  }
  update(t, dt) {
    const prev = this.top;
    switch (this.state) {
      case 'wait': if (t >= this.t0) { this.state = 'windup'; this.ts = t; } break;
      case 'windup': { const u = Math.min(1, (t - this.ts) / .12); this.top = this.top0 + .2 * Ease.outQuad(u); if (u >= 1) { this.state = 'accel'; this.ts = t; } break; }
      case 'accel': { const u = Math.min(1, (t - this.ts) / .2); this.speed = this.vmax * Ease.inQuad(u); this.top -= this.speed * dt; if (u >= 1) this.state = 'spin'; break; }
      case 'spin': this.top -= this.vmax * dt; break;
      case 'stopping': {
        const u = Math.min(1, (t - this.ts) / this.dur);
        this.top = this.stopFrom - this.dist * landCurve(u);
        if (u >= 1) {
          this.offset = this.finalStop - 0; this.top = 0; this.over.clear(); this.state = 'idle'; this.vel = 0;
          const cb = this.onLand; this.onLand = null; cb && cb();
          return;
        }
        break;
      }
    }
    this.vel = dt > 0 ? Math.abs(prev - this.top) / dt : 0;
  }
}

/* ============================================================ VIEW */
class View {
  constructor(canvas, art) {
    this.cv = canvas; this.ctx = canvas.getContext('2d'); this.art = art;
    this.reels = Array.from({ length: NR }, (_, i) => new Reel(i));
    this.particles = []; this.tweens = []; this.toasts = []; this.overlay = null;
    this.win = null; this.mode = 'base'; this.fsHud = null;
    this.t = 0; this.last = performance.now();
    this.buildStatic();
    this.resize(); addEventListener('resize', () => this.resize());
  }
  resize() {
    const r = this.cv.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
    this.cv.width = Math.round(r.width * dpr); this.cv.height = Math.round(r.height * dpr); this.k = this.cv.width / W;
  }
  buildStatic() {
    this.bg = { base: this.paintBackground('base'), free: this.paintBackground('free') };
    this.frame = { base: this.paintFrame('base'), free: this.paintFrame('free') };

    if (!win) return;
    const el = t - win.t0;
    for (const w of active) {
      if (w.line == null) continue;
      const line = CFG.paylines[w.line];
      const pts = [[RX - 14, RY + line[0] * SH + SH / 2], ...line.map((row, r) => this.cellCenter(r, row)), [RX + SW * NR + 14, RY + line[4] * SH + SH / 2]];
      let len = 0; for (let i = 1; i < pts.length; i++) len += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
      const prog = active.length > 1 || win.list.length === 1 ? clamp(el / .5, 0, 1) : 1;
      c.save(); c.lineJoin = 'round'; c.lineCap = 'round';
      c.setLineDash([len, len]); c.lineDashOffset = len * (1 - Ease.outCubic(prog));
      c.beginPath(); pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y));
      c.shadowColor = w.color; c.shadowBlur = 18; c.strokeStyle = w.color; c.lineWidth = 7; c.globalAlpha = .9; c.stroke();
      c.shadowBlur = 0; c.strokeStyle = '#fff'; c.lineWidth = 2; c.stroke();
      c.restore();
    }
    for (const w of active) for (const [r, row] of w.cells) {
      const [cx, cy] = this.cellCenter(r, row), sym = this.reels[r].symAt(row);
      const s = 1.04 + .08 * Math.abs(Math.sin((t - win.t0) * 3.4));
      c.save(); c.globalCompositeOperation = 'lighter'; c.globalAlpha = .5 + .25 * Math.sin(t * 6);
      c.drawImage(this.glows.gold, cx - 90, cy - 90, 180, 180); c.restore();
      c.drawImage(this.art.tex[sym], cx - SW * s / 2, cy - SH * s / 2, SW * s, SH * s);
    }
    if (active.length === 1 && win.list.length > 1) {
      const w = active[0], [lr, lrow] = w.cells[w.cells.length - 1], [cx, cy] = this.cellCenter(lr, lrow);
      const label = w.label;
      c.save(); c.font = `800 20px ${FONT_N}`; const tw = c.measureText(label).width + 28;
      c.fillStyle = 'rgba(10,6,20,.88)'; c.beginPath(); c.roundRect(cx - tw / 2, cy + SH / 2 - 40, tw, 32, 16); c.fill();
      c.strokeStyle = w.color; c.lineWidth = 2; c.stroke();
      c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(label, cx, cy + SH / 2 - 24); c.restore();
    }
  }
  drawParticles(c, types) {
    c.save();
    for (const p of this.particles) {
      if (!types.includes(p.type)) continue;
      const a = clamp(p.life / p.max, 0, 1);
      if (p.type === 'coin') {
        const sx = Math.cos(this.t * p.spin + p.ph);
        c.globalAlpha = Math.min(1, a * 2);
        c.save(); c.translate(p.x, p.y); c.scale(Math.abs(sx) < .08 ? .08 : sx, 1); c.drawImage(this.coin, -p.size / 2, -p.size / 2, p.size, p.size); c.restore();
      } else {
        c.globalCompositeOperation = 'lighter';
        c.globalAlpha = p.type === 'firefly' ? a * (.5 + .5 * Math.sin(this.t * 4 + p.ph)) : a;
        const s = p.size * (p.type === 'ember' ? a : 1);
        c.drawImage(this.glows[p.glow], p.x - s, p.y - s, s * 2, s * 2);
        c.globalCompositeOperation = 'source-over';
      }
    }
    c.restore();
  }
  drawToasts(c, t) {
    this.toasts = this.toasts.filter(o => t - o.t0 < o.dur);
    for (const o of this.toasts) {
      const u = (t - o.t0) / o.dur, s = Ease.outBack(Math.min(1, u * 4)), a = u > .7 ? 1 - (u - .7) / .3 : 1;
      c.save(); c.globalAlpha = a; c.translate(W / 2, o.y - u * 40); c.scale(s, s);
      c.font = `900 ${o.size}px ${FONT_N}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
      c.lineWidth = 10; c.strokeStyle = '#1a0a00'; c.strokeText(o.text, 0, 0); c.fillStyle = o.color; c.fillText(o.text, 0, 0);
      c.restore();
    }
  }
  rays(c, x, y, t, alpha, col = '255,210,110') {
    c.save(); c.translate(x, y); c.rotate(t * .25); c.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 18; i++) {
      c.rotate(TAU / 18);
      const g = c.createLinearGradient(0, 0, 0, -700); g.addColorStop(0, `rgba(${col},${.35 * alpha})`); g.addColorStop(1, `rgba(${col},0)`);
      c.fillStyle = g; c.beginPath(); c.moveTo(0, 0); c.lineTo(-60, -700); c.lineTo(60, -700); c.closePath(); c.fill();
    }
    c.restore();
  }
  bigText(c, text, x, y, size, fill, s = 1, font = FONT_N) {
    c.save(); c.translate(x, y); c.scale(s, s);
    c.font = `900 ${size}px ${font}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
    c.lineWidth = size * .2; c.strokeStyle = '#1a0800'; c.strokeText(text, 0, 0);
    c.fillStyle = fill || goldGrad(c, 0, -size / 2, 0, size / 2); c.fillText(text, 0, 0); c.restore();
  }
  drawOverlay(c, t) {
    const o = this.overlay, el = t - o.t0;
    const fade = o.t1 ? 1 - clamp((t - o.t1) / .35, 0, 1) : clamp(el / .3, 0, 1);
    if (o.t1 && fade <= 0) { this.overlay = null; return; }
    c.save(); c.globalAlpha = fade;
    c.fillStyle = 'rgba(4,2,12,.72)'; c.fillRect(0, 0, W, H);
    if (o.type === 'big') {
      this.rays(c, W / 2, 330, t, 1);
      const tier = BIG_WIN_TIERS[o.tier];
      const ts = Ease.outElastic(clamp((t - o.tierT) / .9, 0, 1));
      this.bigText(c, tier.name, W / 2, 250, 92, null, ts * (1 + .03 * Math.sin(t * 5)), FONT_T);
      this.bigText(c, tier.sub, W / 2, 330, 34, '#ffe9b0', ts, FONT_N);
      this.bigText(c, fmt(o.value), W / 2, 430, 84, '#ffffff', 1 + .02 * Math.sin(t * 9));
    } else if (o.type === 'fsIntro') {
      this.rays(c, W / 2, 300, t, 1, '255,150,60');
      this.bigText(c, 'GEM RUSH', W / 2, 190, 86, null, Ease.outBack(clamp(el / .6, 0, 1)), FONT_T);
      this.bigText(c, 'FREE SPINS', W / 2, 270, 52, '#ffe9b0', Ease.outBack(clamp((el - .15) / .6, 0, 1)));
      this.bigText(c, String(o.spins), W / 2, 380, 120, null, Ease.outElastic(clamp((el - .3) / 1, 0, 1)));
      c.font = `700 20px ${FONT_N}`; c.fillStyle = '#f2d48a'; c.textAlign = 'center';
      c.fillText('Every winning spin grows the Gem Multiplier', W / 2, 470);
      for (let k = 0; k < 4; k++) { // elephant herd crossing
        const x = ((el * 110 + k * 230) % (W + 320)) - 160, bob = Math.abs(Math.sin(el * 4 + k)) * 6;
        c.drawImage(this.art.tex.W, x - 70, 520 - bob, 140, 122);
      }
      if (el > 1.2) { c.globalAlpha = fade * (.6 + .4 * Math.sin(t * 4)); c.font = `800 18px ${FONT_N}`; c.fillStyle = '#fff'; c.fillText('TAP TO BEGIN', W / 2, 505); }
    } else if (o.type === 'fsOutro') {
      this.rays(c, W / 2, 330, t, 1, '255,180,90');
      this.bigText(c, 'GEM RUSH COMPLETE', W / 2, 230, 62, null, Ease.outBack(clamp(el / .6, 0, 1)), FONT_T);
      this.bigText(c, 'TOTAL WIN', W / 2, 320, 36, '#ffe9b0');
      this.bigText(c, fmt(o.value), W / 2, 410, 92, '#ffffff', 1 + .02 * Math.sin(t * 9));
      c.font = `700 20px ${FONT_N}`; c.fillStyle = '#f2d48a'; c.textAlign = 'center'; c.fillText(`${o.spins} free spins played`, W / 2, 490);
    }
    c.restore();
  }
}

/* ============================================================ GAME CONTROLLER
   Replays a book (event list) — identical code path for local demo and RGS.   */
class Game {
  constructor(view, provider) {
    this.view = view; this.provider = provider; this.engine = new MathEngine(CFG);
    this.betIdx = 2; this.balance = 0; this.busy = false; this.auto = false; this.turbo = false;
    this.skipping = false; this.waiters = new Set();
    view.reels.forEach(r => r.setStrip(CFG.strips.base[r.i], SecureRng.int(CFG.strips.base[r.i].length)));
  }
  get bet() { return BETS[this.betIdx]; }
  async init() { const a = await this.provider.authenticate(); this.balance = a.balance; ui.update(); }

  sleep(s) {
    if (this.skipping) return Promise.resolve();
    return new Promise(res => { const w = { res }; w.id = setTimeout(() => { this.waiters.delete(w); res(); }, s * 1000); this.waiters.add(w); });
  }
  skip() { this.skipping = true; for (const w of this.waiters) { clearTimeout(w.id); w.res(); } this.waiters.clear(); this.view.finishTweens(); }
  press() { audio.resume(); if (this.busy) this.skip(); else this.spin(); }

  async spin() {
    if (this.busy) return;
    if (this.bet > this.balance + 1e-9) { this.view.toast('INSUFFICIENT BALANCE', { size: 34, color: '#ff8a8a' }); this.setAuto(false); return; }
    this.busy = true; ui.update();
    const bet = this.bet;
    this.view.clearWins(); ui.setWin(0);
    let res;
    try { res = await this.provider.play(bet); }
    catch (e) { console.error(e); this.view.toast('CONNECTION ERROR', { size: 34, color: '#ff8a8a' }); this.busy = false; ui.update(); return; }
    this.balance = res.balance; ui.update();
    try { await this.playBook(res.round.events, bet); }
    catch (e) { console.error('presentation error', e); }
    const end = await this.provider.endRound(bet, res.round);
    this.balance = end.balance;
    this.busy = false; ui.update();
    if (this.auto) { await new Promise(r => setTimeout(r, this.turbo ? 150 : 450)); if (this.auto && !this.busy) this.spin(); }
  }
  setAuto(on) { this.auto = on; ui.update(); if (on && !this.busy) this.spin(); }

  async playBook(events, bet) {
    let shown = 0, fsTotal = 0, fsSpins = 0, inFs = false;
    for (const ev of events) {
      switch (ev.type) {
        case 'reveal':
          if (ev.gameType === 'freegame') {
            const h = this.view.fsHud; h.spin = ev.spin; h.spinPop = this.view.t;
            if (ev.multiplier !== h.mult) { h.mult = ev.multiplier; h.multPop = this.view.t; audio.multUp(); }
            await this.sleep(this.turbo ? .1 : .3);
          }
          await this.spinTo(ev);
          break;
        case 'winInfo': {
          await this.presentWin(ev, bet, shown, inFs);
          shown += ev.amount * bet;
          if (inFs) fsTotal += ev.amount * bet;
          break;
        }
        case 'freeSpinTrigger':
          await this.freeSpinIntro(ev);
          inFs = true; fsSpins = ev.totalFs;
          break;
        case 'freeSpinRetrigger':
          fsSpins += ev.added; this.view.fsHud.total = fsSpins; this.view.fsHud.spinPop = this.view.t;
          audio.scatterLand(5); this.view.toast(`+${ev.added} FREE SPINS`, { size: 58 });
          await this.sleep(1.4);
          break;
        case 'maxWinReached':
          this.view.toast('MAX WIN REACHED', { size: 60, dur: 2.4 }); await this.sleep(2);
          break;
        case 'finalWin':
          if (inFs) await this.freeSpinOutro(ev.amount * bet, this.view.fsHud.spin);
          ui.setWin(ev.amount * bet);
          break;
      }
    }
  }

  async spinTo(ev) {
    this.skipping = false;
    const v = this.view, board = ev.board, turbo = this.turbo;
    v.clearWins();
    const vmax = turbo ? 42 : 27;
    audio.spinStart(); audio.spinLoop(true);
    v.reels.forEach((r, i) => r.start(v.t, i * (turbo ? .02 : .06), vmax));
    await this.sleep(turbo ? .3 : .62);
    let sc = 0, landedSc = 0, stopRiser = null;
    const lands = [];
    for (let i = 0; i < NR; i++) {
      const antic = !this.skipping && sc >= 2 && i >= 2;
      if (i > 0) {
        if (antic) {
          await Promise.all(lands); // build tension: previous reels settle first
          v.reels[i].antic = 1; for (let k = i + 1; k < NR; k++) v.reels[k].antic = 0;
          if (!stopRiser) stopRiser = audio.anticipation();
          await this.sleep(1.5);
        } else await this.sleep(turbo ? .06 : .15);
      }
      const reel = v.reels[i];
      lands.push(reel.requestStop(ev.stops[i], v.t, antic ? 7 : (this.skipping ? 2 : 4)).then(() => {
        reel.antic = 0;
        audio.reelStop(i);
        board[i].forEach((s, row) => {
          if (s === 'S') { landedSc++; reel.pop[row] = v.t; audio.scatterLand(landedSc); const [x, y] = v.cellCenter(i, row); v.burst(x, y, 26, 'cyan'); }
          if (s === 'W') { reel.pop[row] = v.t; const [x, y] = v.cellCenter(i, row); v.burst(x, y, 10, 'gold'); }
        });
      }));
      sc += board[i].filter(s => s === 'S').length;
    }
    await Promise.all(lands);
    if (stopRiser) stopRiser();
    audio.spinLoop(false);
  }

  async presentWin(ev, bet, before, inFs) {
    this.skipping = false;
    const v = this.view, amt = ev.amount * bet, x = ev.amount;
    const list = ev.wins.map(w => {
      const line = CFG.paylines[w.line];
      return { line: w.line, cells: line.slice(0, w.count).map((row, r) => [r, row]), color: `hsl(${(w.line * 47) % 360},95%,62%)`,
               label: `LINE ${w.line + 1}  ·  ${fmt(w.pay / CFG.paylines.length * bet * (ev.multiplier || 1))}` };
    });
    if (ev.scatters.length >= 3) list.push({ line: null, cells: ev.scatters, color: '#9db8ff', label: `SCATTER  ·  ${fmt((CFG.scatterPays[ev.scatters.length] || 0) * bet * (ev.multiplier || 1))}` });
    v.showWins(list);
    list.forEach(w => w.cells.forEach(([r, row]) => { const [cx, cy] = v.cellCenter(r, row); v.burst(cx, cy, 8, 'gold'); }));
    if (inFs && ev.multiplier > 1) { v.toast(`x${ev.multiplier}`, { size: 110, dur: 1.1, y: 330 }); audio.multUp(); await this.sleep(.6); this.skipping = false; }
    if (x >= BIG_WIN_TIERS[0].at) { await this.bigWin(before, amt, x, bet); return; }
    audio.win(x < 1 ? 0 : x < 5 ? 1 : 2);
    const dur = clamp(.5 + x * .22, .5, 2.4) * (this.turbo ? .5 : 1);
    await this.countUp(before, before + amt, dur);
    await this.sleep(inFs ? .7 : .2);
  }
  countUp(from, to, dur) {
    let lastTick = 0;
    ui.flash(true);
    return this.view.tween(dur, u => {
      ui.setWin(lerp(from, to, u));
      if (this.view.t - lastTick > .06 && u < 1) { lastTick = this.view.t; audio.tick(); }
    }, Ease.outQuad).then(() => ui.flash(false));
  }
  async bigWin(before, amt, x, bet) {
    const v = this.view;
    const tierFor = val => { let k = 0; BIG_WIN_TIERS.forEach((tr, i) => { if (val / bet >= tr.at) k = i; }); return k; };
    v.overlay = { type: 'big', t0: v.t, tier: 0, tierT: v.t, value: 0 };
    v.coinShower(40); audio.bigWin();
    const dur = 3 + tierFor(amt) * 2.2;
    let lastTick = 0;
    await v.tween(dur, u => {
      const val = amt * u; v.overlay.value = val; ui.setWin(before + val);
      const k = tierFor(val);
      if (k > v.overlay.tier) { v.overlay.tier = k; v.overlay.tierT = v.t; audio.tierUp(); v.coinShower(50); }
      if (v.t - lastTick > .07 && u < 1) { lastTick = v.t; audio.tick(); }
    }, Ease.outCubic);
    v.overlay.value = amt;
    this.skipping = false;
    await this.sleep(2.6);
    v.overlay.t1 = v.t;
    this.skipping = false;
    await this.sleep(.4);
  }
  async freeSpinIntro(ev) {
    this.skipping = false;
    const v = this.view;
    v.showWins([{ line: null, cells: ev.positions, color: '#9db8ff', label: '' }]);
    audio.impact();
    await this.sleep(1.6);
    this.skipping = false;
    v.overlay = { type: 'fsIntro', t0: v.t, spins: ev.totalFs };
    audio.fanfare();
    await this.sleep(1.2); this.skipping = false;
    await this.sleep(this.auto ? 2.2 : 30);
    v.clearWins();
    v.setMode('free'); audio.startMusic('free');
    v.reels.forEach(r => r.setStrip(CFG.strips.free[r.i], SecureRng.int(CFG.strips.free[r.i].length)));
    v.fsHud = { spin: 0, total: ev.totalFs, mult: CFG.freeSpins.multiplierStart, spinPop: v.t, multPop: v.t };
    v.overlay.t1 = v.t;
    this.skipping = false;
    await this.sleep(.5);
  }
  async freeSpinOutro(total, spins) {
    this.skipping = false;
    const v = this.view;
    v.overlay = { type: 'fsOutro', t0: v.t, value: 0, spins };
    audio.fanfare(); v.coinShower(60);
    await v.tween(this.turbo ? 1 : 2.4, u => { v.overlay.value = total * u; }, Ease.outCubic);
    this.skipping = false;
    await this.sleep(this.auto ? 2 : 30);
    v.overlay.t1 = v.t; v.fsHud = null;
    v.setMode('base'); audio.startMusic('base');
    v.reels.forEach(r => r.setStrip(CFG.strips.base[r.i], SecureRng.int(CFG.strips.base[r.i].length)));
    v.clearWins();
    this.skipping = false;
    await this.sleep(.4);
  }
}

/* ============================================================ UI */
const $ = id => document.getElementById(id);
const audio = new SoundEngine();
let game, view;
const ui = {
  update() {
    if (!game) return;
    $('balance').textContent = fmt(game.balance);
    $('bet').textContent = fmt(game.bet);
    $('betDown').disabled = game.busy || game.betIdx === 0;
    $('betUp').disabled = game.busy || game.betIdx === BETS.length - 1;
    $('spin').classList.toggle('busy', game.busy);
    $('spin').classList.toggle('stop', game.busy);
    $('btnAuto').classList.toggle('on', game.auto); $('btnAuto').setAttribute('aria-pressed', game.auto);
    $('btnTurbo').classList.toggle('on', game.turbo); $('btnTurbo').setAttribute('aria-pressed', game.turbo);
  },
  setWin(v) { $('win').textContent = fmt(v); },
  flash(on) { $('win').classList.toggle('flash', on); },
};

function buildPaytable() {
  const n = CFG.paylines.length;
  const bet = game.bet;
  const order = ['W', 'H1', 'H2', 'H3', 'H4', 'H5', 'L1', 'L2', 'L3', 'L4'];
  const cards = order.map(s => {
    const p = CFG.linePays[s];
    const rows = [5, 4, 3].map(k => `<div><span>${k}</span>${fmt(p[k] / n * bet)}</div>`).join('');
    return `<div class="sym"><img alt="" src="${view.art.tex[s].toDataURL()}"><div><div class="nm">${CFG.symbols[s].name}</div>${rows}</div></div>`;
  }).join('');
  const sc = [5, 4, 3].map(k => `<div><span>${k}</span>${fmt(CFG.scatterPays[k] * bet)} + ${CFG.freeSpins.award[k]} FS</div>`).join('');
  const lines = CFG.paylines.map((l, i) => `<svg viewBox="0 0 50 34"><rect x="0" y="0" width="50" height="34" rx="3" fill="#13222f"/>${
    l.map((row, r) => `<rect x="${r * 10 + 1}" y="${row * 11 + 1}" width="8" height="9" rx="1.5" fill="hsl(${(i * 47) % 360},90%,60%)"/>`).join('')}<text x="25" y="33" font-size="0" fill="none">${i + 1}</text></svg>`);
  $('ptBody').innerHTML = `
    <div class="grid">${cards}<div class="sym"><img alt="" src="${view.art.tex.S.toDataURL()}"><div><div class="nm">${CFG.symbols.S.name} (scatter)</div>${sc}</div></div></div>
    <h3>Features</h3>
    <ul>
      <li><b>Golden Elephant</b> is WILD: substitutes for every symbol except the Lion Rock scatter, and pays on its own.</li>
      <li>3, 4 or 5 <b>Lion Rock</b> scatters anywhere pay and award ${CFG.freeSpins.award[3]}, ${CFG.freeSpins.award[4]} or ${CFG.freeSpins.award[5]} <b>Gem Rush Free Spins</b>.</li>
      <li>In free spins every win is multiplied by the <b>Gem Multiplier</b>. It starts at x${CFG.freeSpins.multiplierStart} and grows by +${CFG.freeSpins.multiplierStep} after every winning spin (max x${CFG.freeSpins.multiplierMax}). Free spins can retrigger.</li>
      <li>Maximum win is <b>${CFG.maxWinMultiplier.toLocaleString()}x</b> the total bet; the round ends when it is reached.</li>
    </ul>
    <h3>Paylines (${n})</h3>
    <div style="display:grid;grid-template-columns:repeat(10,1fr);gap:.6cqw">${lines.join('')}</div>
    <h3>Rules</h3>
    <p>Wins pay left to right on adjacent reels starting from the leftmost reel. Only the highest win per line is paid. Line wins are shown for the current total bet.
    Theoretical RTP: 96.10% (prototype math, simulated). Malfunction voids all pays and plays.</p>`;
}

async function boot() {
  try { await Promise.race([Promise.all([document.fonts.load(`900 40px "Cinzel"`), document.fonts.load(`900 40px "Cinzel Decorative"`)]), new Promise(r => setTimeout(r, 2500))]); } catch (e) { /* offline: fall back to system fonts */ }
  const art = buildTextures();
  view = new View($('stage'), art);
  game = new Game(view, new LocalDemoProvider(new MathEngine(CFG)));
  await game.init();
  view.startLoop();
  $('loading').hidden = true; $('btnStart').hidden = false; $('btnStart').focus();

  $('btnStart').onclick = () => { audio.init(); audio.resume(); audio.startMusic('base'); $('start').classList.add('hidden'); };
  $('spin').onclick = () => { audio.click(); game.press(); };
  $('stage').addEventListener('pointerdown', () => { if (game.busy) game.skip(); });
  $('betUp').onclick = () => { if (!game.busy && game.betIdx < BETS.length - 1) { game.betIdx++; audio.click(); ui.update(); } };
  $('betDown').onclick = () => { if (!game.busy && game.betIdx > 0) { game.betIdx--; audio.click(); ui.update(); } };
  $('btnAuto').onclick = () => { audio.click(); game.setAuto(!game.auto); };
  $('btnTurbo').onclick = () => { audio.click(); game.turbo = !game.turbo; ui.update(); };
  $('btnSound').onclick = e => { audio.setSfx(!audio.sfxOn); e.currentTarget.classList.toggle('on', audio.sfxOn); e.currentTarget.setAttribute('aria-pressed', audio.sfxOn); };
  $('btnMusic').onclick = e => { audio.setMusic(!audio.musicOn); e.currentTarget.classList.toggle('on', audio.musicOn); e.currentTarget.setAttribute('aria-pressed', audio.musicOn); };
  $('btnInfo').onclick = () => { buildPaytable(); $('paytable').classList.remove('hidden'); };
  $('ptClose').onclick = () => $('paytable').classList.add('hidden');
  $('paytable').addEventListener('click', e => { if (e.target.id === 'paytable') $('paytable').classList.add('hidden'); });
  addEventListener('keydown', e => {
    if (e.code === 'Space' && $('start').classList.contains('hidden') && $('paytable').classList.contains('hidden')) { e.preventDefault(); game.press(); }
    if (e.code === 'Escape') $('paytable').classList.add('hidden');
  });
  ui.update();
}
boot();
</script>
</body>
</html>
